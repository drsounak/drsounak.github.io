<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikZ Diagram Builder — Sounak Sadhukhan</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }

    /* ── Identity strip ── */
    .id-strip {
      height: 38px;
      background: #92400e;
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      flex-shrink: 0;
      position: relative;
      z-index: 9999;
    }
    .id-back {
      display: flex; align-items: center; gap: 5px;
      font-size: .72rem; font-weight: 700; letter-spacing: .05em;
      color: #fef3c7;
      opacity: .75;
      text-decoration: none;
      padding: 3px 10px 3px 7px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 100px;
      transition: opacity .15s;
    }
    .id-back:hover { opacity: 1; text-decoration: none; }
    .id-divider { width: 1px; height: 18px; background: rgba(255,255,255,.2); }
    .id-title {
      font-size: .8rem; font-weight: 700;
      color: #fef3c7;
      letter-spacing: .04em;
    }
    .id-sub {
      font-size: .68rem;
      color: #fef3c7;
      opacity: .55;
      margin-left: 2px;
      letter-spacing: .02em;
    }

    /* ── Tool fills rest of screen ── */
    #root {
      height: calc(100vh - 38px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
  </style>
</head>
<body>

<!-- Identity strip: unique per tool -->
<div class="id-strip">

  return { id, from, to, label: label ?? "", style: style ?? "->" };

let _seq = 0;
const newId   = () => `n${++_seq}`;
const snapTo  = v  => Math.round(v / SNAP) * SNAP;

function getEdgePoint(shape, tx, ty) {
  const { x: cx, y: cy, w, h, type } = shape;
  const hw = w / 2, hh = h / 2;
  const dx = tx - cx, dy = ty - cy;
  if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return { x: cx, y: cy };
  if (["circle","connector","donut"].includes(type)) {
    const len = Math.hypot(dx, dy);
    return { x: cx + hw * dx / len, y: cy + hw * dy / len };
  }
  if (["ellipse","terminal","cloud","callout_oval","callout_cloud","callout_thought"].includes(type)) {
    const len = Math.hypot(dx / hw, dy / hh);
    return { x: cx + dx / len, y: cy + dy / len };
  }
  if (["diamond","decision"].includes(type)) {
    const t = 1 / (Math.abs(dx) / hw + Math.abs(dy) / hh + 1e-9);
    return { x: cx + dx * t, y: cy + dy * t };
  }
  const tx_ = hw / (Math.abs(dx) + 1e-9);
  const ty_ = hh / (Math.abs(dy) + 1e-9);
  return { x: cx + dx * Math.min(tx_, ty_), y: cy + dy * Math.min(tx_, ty_) };
}

//  TIKZ CODE GENERATOR
// ═══════════════════════════════════════════════════════════════════
function generateTikz(shapes, connections) {
  if (!shapes.length) return [
    "% ─── Overleaf TikZ Builder ────────────────",
    "% Add shapes, then copy this code to Overleaf",
    "",
    "% Preamble needed in your .tex file:",
    "% \\usepackage{tikz}",
    "% \\usetikzlibrary{shapes.geometric, shapes.misc,",
    "%   shapes.arrows, shapes.callouts,",
    "%   arrows.meta, positioning}",
  ].join("\n");

  const libs = new Set(["arrows.meta","positioning"]);
  shapes.forEach(s => (TIKZ_MAP[s.type]?.libs ?? []).forEach(l => libs.add(l)));

  const toX = px  => (px / PX_PER_CM).toFixed(2);
  const toY = py  => ((CANVAS_H - py) / PX_PER_CM).toFixed(2);

  const lines = [
    "% ─── Generated by Overleaf TikZ Builder ───",
    "",
    "% Paste this into your Overleaf .tex file.",
    "% Add to preamble (once):",
    "% \\usepackage{tikz}",
    `% \\usetikzlibrary{${[...libs].join(", ")}}`,
    "",
    "\\begin{figure}[h]",
    "  \\centering",
    "  \\begin{tikzpicture}[",
    "    every node/.style={align=center, font=\\small},",
    "    node distance=1cm",
    "  ]",
    "",
    "  % Canvas: A4 (21cm × 29.7cm) — coordinates in cm from bottom-left",
    "",
    "  % --- Nodes ---",
  ];

  shapes.forEach(s => {
    const col  = COLORS[s.colorIdx ?? 0];
    const tdef = TIKZ_MAP[s.type] ?? { draw:"rectangle", libs:[] };
    const wCm  = (s.w / PX_PER_CM).toFixed(2);
    const hCm  = (s.h / PX_PER_CM).toFixed(2);
    const lbl  = (s.label || "").replace(/\n/g,"\\\\").replace(/&/g,"\\&").replace(/_/g,"\\_");
    const isCircle = ["circle","connector"].includes(s.type);
    const sizeOpt  = isCircle ? `minimum size=${wCm}cm` : `minimum width=${wCm}cm, minimum height=${hCm}cm`;
    const textW    = isCircle ? "" : `, text width=${wCm}cm`;
    lines.push(
      `  \\node[draw=${col.tikzDraw}, fill=${col.tikzFill}, ${tdef.draw},`
      + ` ${sizeOpt}${textW}]`
      + ` (${s.id}) at (${toX(s.x)}, ${toY(s.y)}) {${lbl}};`
    );
  });

  if (connections.length) {
    lines.push("", "  % --- Connections ---");
    connections.forEach(c => {
      const tikzStyle = ARROW_TYPES.find(a => a.id === c.style)?.tikz ?? "->";
      const sStr  = tikzStyle ? `[${tikzStyle}]` : "";
      const lPart = c.label ? ` node[midway, fill=white, font=\\scriptsize] {${c.label}}` : "";
      lines.push(`  \\draw${sStr} (${c.from}) --${lPart} (${c.to});`);
    });
  }

  lines.push("", "  \\end{tikzpicture}");
  lines.push("  \\caption{Your figure caption}");
  lines.push("  \\label{fig:diagram}");
  lines.push("\\end{figure}");
  return lines.join("\n");
}

function star(n, outer, inner, angleOffset = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 === 0 ? outer : inner;
    const a = (i * Math.PI / n) + angleOffset;
    pts.push(`${(r * Math.cos(a)).toFixed(1)},${(r * Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(" ");
}
function poly(n, rx, ry, offset = -Math.PI / 2) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i * 2 * Math.PI / n) + offset;
    pts.push(`${(rx * Math.cos(a)).toFixed(1)},${(ry * Math.sin(a)).toFixed(1)}`);
  }
  return pts.join(" ");
}

function ShapeBody({ type, w, h, fill, stroke, sw = 1.5 }) {
  const hw = w / 2, hh = h / 2;
  const s = { fill, stroke, strokeWidth: sw };

  switch (type) {
    /* ─── Rectangles ─── */
    case "rect":      return <rect x={-hw} y={-hh} width={w} height={h} style={s} />;
    case "rect_round":return <rect x={-hw} y={-hh} width={w} height={h} rx={10} ry={10} style={s} />;
    case "rect_snip": {
      const c = 14;
      return <polygon points={`${-hw},${-hh} ${hw-c},${-hh} ${hw},${-hh+c} ${hw},${hh} ${-hw},${hh}`} style={s} />;
    }
    case "rect_snip2": {
      const c = 12;
      return <polygon points={`${-hw+c},${-hh} ${hw-c},${-hh} ${hw},${-hh+c} ${hw},${hh-c} ${hw-c},${hh} ${-hw+c},${hh} ${-hw},${hh-c} ${-hw},${-hh+c}`} style={s} />;
    }
    case "rect_fold": {
      const fc = Math.min(w, h) * 0.22;
      return (
        <g>
          <polygon points={`${-hw},${-hh} ${hw-fc},${-hh} ${hw},${-hh+fc} ${hw},${hh} ${-hw},${hh}`} style={s} />
          <polyline points={`${hw-fc},${-hh} ${hw-fc},${-hh+fc} ${hw},${-hh+fc}`}
            fill="none" stroke={stroke} strokeWidth={sw} />
        </g>
      );
    }
    case "rect_dbl":
      return (
        <g>
          <rect x={-hw} y={-hh} width={w} height={h} style={s} />
          <rect x={-hw+5} y={-hh+5} width={w-10} height={h-10} fill="none" stroke={stroke} strokeWidth={sw * 0.7} />
        </g>
      );

    /* ─── Basic ─── */
    case "circle":    case "connector":
      return <circle r={hw} style={s} />;
    case "ellipse":
      return <ellipse rx={hw} ry={hh} style={s} />;
    case "terminal":
      return <rect x={-hw} y={-hh} width={w} height={h} rx={hh} ry={hh} style={s} />;
    case "triangle":
      return <polygon points={`0,${-hh} ${hw},${hh} ${-hw},${hh}`} style={s} />;
    case "rt_triangle":
      return <polygon points={`${-hw},${-hh} ${hw},${hh} ${-hw},${hh}`} style={s} />;
    case "diamond":   case "decision":
      return <polygon points={`0,${-hh} ${hw},0 0,${hh} ${-hw},0`} style={s} />;
    case "parallelogram": {
      const sk = hw * 0.2;
      return <polygon points={`${-hw+sk},${-hh} ${hw},${-hh} ${hw-sk},${hh} ${-hw},${hh}`} style={s} />;
    }
    case "trapezoid": {
      const tw = hw * 0.28;
      return <polygon points={`${-hw+tw},${-hh} ${hw-tw},${-hh} ${hw},${hh} ${-hw},${hh}`} style={s} />;
    }
    case "hexagon":   return <polygon points={poly(6, hw, hh)} style={s} />;
    case "pentagon":  return <polygon points={poly(5, hw, hh)} style={s} />;
    case "octagon":   return <polygon points={poly(8, hw, hh, -Math.PI / 8)} style={s} />;
    case "preparation": return <polygon points={`${-hw+hw*0.25},${-hh} ${hw-hw*0.25},${-hh} ${hw},0 ${hw-hw*0.25},${hh} ${-hw+hw*0.25},${hh} ${-hw},0`} style={s} />;
    case "cross": {
      const t = hw * 0.32;
      return <polygon points={`${-t},${-hh} ${t},${-hh} ${t},${-t} ${hw},${-t} ${hw},${t} ${t},${t} ${t},${hh} ${-t},${hh} ${-t},${t} ${-hw},${t} ${-hw},${-t} ${-t},${-t}`} style={s} />;
    }
    case "heart": {
      const d = `M 0,${hh*0.35} C ${-hw*0.6},${hh*0.0} ${-hw},${-hh*0.3} ${-hw},${-hh*0.55}`
        + ` C ${-hw},${-hh} ${-hw*0.4},${-hh} 0,${-hh*0.5}`
        + ` C ${hw*0.4},${-hh} ${hw},${-hh} ${hw},${-hh*0.55}`
        + ` C ${hw},${-hh*0.3} ${hw*0.6},${hh*0.0} 0,${hh*0.35} Z`;
      return <path d={d} style={s} />;
    }
    case "lightning": {
      const d = `M ${-hw*0.1},${-hh} L ${-hw*0.5},0 L ${hw*0.15},0 L ${-hw*0.15},${hh} L ${hw*0.5},0 L ${-hw*0.15},0 Z`;
      return <path d={d} style={s} />;
    }
    case "moon": {
      const d = `M 0,${-hh} A ${hw} ${hh} 0 1 1 0,${hh} A ${hw*0.65} ${hh*0.85} 0 1 0 0,${-hh} Z`;
      return <path d={d} style={s} />;
    }
    case "donut":
      return (
        <g>
          <circle r={hw} style={s} />
          <circle r={hw * 0.45} fill="white" stroke={stroke} strokeWidth={sw} />
        </g>
      );
    case "brace_left": {
      const d = `M ${hw*0.3},${-hh} Q ${-hw*0.3},${-hh} ${-hw*0.3},${-hh*0.5}`
        + ` Q ${-hw*0.3},0 ${-hw*0.9},0`
        + ` Q ${-hw*0.3},0 ${-hw*0.3},${hh*0.5}`
        + ` Q ${-hw*0.3},${hh} ${hw*0.3},${hh}`;
      return <path d={d} fill="none" stroke={stroke} strokeWidth={sw * 1.5} />;
    }
    case "brace_right": {
      const d = `M ${-hw*0.3},${-hh} Q ${hw*0.3},${-hh} ${hw*0.3},${-hh*0.5}`
        + ` Q ${hw*0.3},0 ${hw*0.9},0`
        + ` Q ${hw*0.3},0 ${hw*0.3},${hh*0.5}`
        + ` Q ${hw*0.3},${hh} ${-hw*0.3},${hh}`;
      return <path d={d} fill="none" stroke={stroke} strokeWidth={sw * 1.5} />;
    }

    /* ─── Block Arrows ─── */
    case "arrow_right": {
      const ah = hh, aw = hw * 0.36, sh = hh * 0.48;
      return <polygon points={`${-hw},${-sh} ${hw-aw},${-sh} ${hw-aw},${-ah} ${hw},0 ${hw-aw},${ah} ${hw-aw},${sh} ${-hw},${sh}`} style={s} />;
    }
    case "arrow_left": {
      const ah = hh, aw = hw * 0.36, sh = hh * 0.48;
      return <polygon points={`${hw},${-sh} ${-hw+aw},${-sh} ${-hw+aw},${-ah} ${-hw},0 ${-hw+aw},${ah} ${-hw+aw},${sh} ${hw},${sh}`} style={s} />;
    }
    case "arrow_up": {
      const ah = hw, sh = hw * 0.48;
      return <polygon points={`${-sh},${hh} ${-sh},${-hh+ah} ${-ah},${-hh+ah} 0,${-hh} ${ah},${-hh+ah} ${sh},${-hh+ah} ${sh},${hh}`} style={s} />;
    }
    case "arrow_down": {
      const ah = hw, sh = hw * 0.48;
      return <polygon points={`${-sh},${-hh} ${-sh},${hh-ah} ${-ah},${hh-ah} 0,${hh} ${ah},${hh-ah} ${sh},${hh-ah} ${sh},${-hh}`} style={s} />;
    }
    case "arrow_lr": {
      const ah = hw * 0.35, sh = hh * 0.48;
      return <polygon points={`${-hw},0 ${-hw+ah},${-hh} ${-hw+ah},${-sh} ${hw-ah},${-sh} ${hw-ah},${-hh} ${hw},0 ${hw-ah},${hh} ${hw-ah},${sh} ${-hw+ah},${sh} ${-hw+ah},${hh}`} style={s} />;
    }
    case "arrow_ud": {
      const ah = hh * 0.32, sh = hw * 0.48;
      return <polygon points={`0,${-hh} ${hw},${-hh+ah} ${sh},${-hh+ah} ${sh},${hh-ah} ${hw},${hh-ah} 0,${hh} ${-hw},${hh-ah} ${-sh},${hh-ah} ${-sh},${-hh+ah} ${-hw},${-hh+ah}`} style={s} />;
    }
    case "chevron": {
      const aw = hw * 0.28;
      return <polygon points={`${-hw},${-hh} ${hw-aw},${-hh} ${hw},0 ${hw-aw},${hh} ${-hw},${hh} ${-hw+aw},0`} style={s} />;
    }
    case "chevron_left": {
      const aw = hw * 0.28;
      return <polygon points={`${hw},${-hh} ${-hw+aw},${-hh} ${-hw},0 ${-hw+aw},${hh} ${hw},${hh} ${hw-aw},0`} style={s} />;
    }
    case "pentagon_arrow": {
      const aw = hw * 0.28;
      return <polygon points={`${-hw},${-hh} ${hw-aw},${-hh} ${hw},0 ${hw-aw},${hh} ${-hw},${hh}`} style={s} />;
    }
    case "notch_arrow": {
      const aw = hw * 0.35, nw = hw * 0.18, sh = hh * 0.48;
      return <polygon points={`${-hw},${-sh} ${-hw+nw},0 ${-hw},${sh} ${hw-aw},${sh} ${hw-aw},${hh} ${hw},0 ${hw-aw},${-hh} ${hw-aw},${-sh}`} style={s} />;
    }
    case "arrow_quad": {
      const t = hw * 0.3, at = hw * 0.55;
      return (
        <g style={s}>
          <polygon points={`0,${-hh} ${t},${-at} ${-t},${-at}`} style={s} />
          <polygon points={`${hh},0 ${at},${t} ${at},${-t}`} style={s} />
          <polygon points={`0,${hh} ${t},${at} ${-t},${at}`} style={s} />
          <polygon points={`${-hh},0 ${-at},${t} ${-at},${-t}`} style={s} />
          <rect x={-t} y={-t} width={t*2} height={t*2} style={s} />
        </g>
      );
    }
    case "arrow_uturn": {
      // Filled U-turn block arrow: left leg up, curves right, right leg down with arrowhead
      const thick = hw * 0.38, ow = hw * 0.46;
      const legR = hw - thick; // inner radius
      const stem = hh * 0.45;  // arrowhead depth
      const d = [
        `M ${-hw},${hh}`,           // bottom-left outer
        `L ${-hw},${-hh*0.15}`,     // up left outer
        `A ${ow} ${ow} 0 0 1 ${hw-thick},${-hh*0.15}`, // curve over top outer
        `L ${hw-thick},${hh-stem}`, // down right outer
        `L ${hw},${hh-stem}`,       // arrowhead right wing
        `L ${hw-thick*0.5},${hh}`,  // arrowhead tip
        `L ${-hw+thick},${hh}`,     // back along bottom
        // inner path back
        `L ${-hw+thick},${-hh*0.15}`,
        `A ${legR} ${legR} 0 0 0 ${-hw+thick*0.01},${-hh*0.15}`, // tiny arc to close
        `Z`,
      ].join(" ");
      // simpler solid version using two rects + semicircle fill
      const ow2 = (hw + hw - thick) / 2;
      const ir = ow2 - thick;
      return (
        <g style={s}>
          <rect x={-hw} y={-hh*0.15} width={thick} height={hh*0.15+hh} style={s}/>
          <rect x={-hw} y={-hh*0.5} width={hw*2-thick} height={thick} style={s}/>
          <polygon points={`${hw-thick},${hh-stem*1.6} ${hw},${hh-stem*1.6} ${hw-thick*0.5},${hh}`} style={s}/>
          <rect x={hw-thick} y={-hh*0.5} width={thick} height={hh*0.5+hh-stem*1.6} style={s}/>
        </g>
      );
    }
    case "arrow_curve": {
      const r = hw * 0.7, lineW = hh * 0.45;
      return (
        <g>
          <path d={`M ${-hw},0 A ${r} ${r} 0 0 1 ${hw*0.72},0`}
            fill="none" stroke={stroke} strokeWidth={lineW} strokeLinecap="round" />
          <polygon points={`${hw*0.6},${-hh*0.4} ${hw},0 ${hw*0.6},${hh*0.4}`} style={{...s,stroke:"none"}} />
        </g>
      );
    }
    case "arrow_loop": {
      const r = hw * 0.55;
      return (
        <g>
          <circle r={r} fill="none" stroke={stroke} strokeWidth={hh * 0.35}
            strokeDasharray={`${r*2*Math.PI * 0.7} ${r*2*Math.PI * 0.3}`} />
          <polygon points={`${r+hh*0.2},${hh*0.1} ${r},${hh*0.5} ${r-hh*0.2},${hh*0.1}`}
            style={{...s,stroke:"none"}} />
        </g>
      );
    }

    /* ─── Equation ─── */
    case "eq_plus": {
      const t = hw * 0.3;
      return <polygon points={`${-t},${-hh} ${t},${-hh} ${t},${-t} ${hw},${-t} ${hw},${t} ${t},${t} ${t},${hh} ${-t},${hh} ${-t},${t} ${-hw},${t} ${-hw},${-t} ${-t},${-t}`} style={s} />;
    }
    case "eq_minus": {
      const bh = Math.max(4, hh * 0.35);
      return <rect x={-hw} y={-bh} width={w} height={bh*2} style={s} />;
    }
    case "eq_multiply": {
      const t = hw * 0.28;
      return (
        <g>
          <polygon points={star(4, hw, t, -Math.PI / 4)} style={s} />
        </g>
      );
    }
    case "eq_divide": {
      const bh = hh * 0.22, r = hw * 0.17;
      return (
        <g>
          <rect x={-hw} y={-bh} width={w} height={bh * 2} style={s} />
          <circle cx={0} cy={-hh * 0.65} r={r} style={s} />
          <circle cx={0} cy={ hh * 0.65} r={r} style={s} />
        </g>
      );
    }
    case "eq_equal": {
      const bh = hh * 0.22;
      return (
        <g>
          <rect x={-hw} y={-bh * 2.8} width={w} height={bh * 1.8} style={s} />
          <rect x={-hw} y={ bh * 1.0} width={w} height={bh * 1.8} style={s} />
        </g>
      );
    }
    case "eq_nequal": {
      const bh = hh * 0.2;
      return (
        <g>
          <rect x={-hw} y={-bh * 2.8} width={w} height={bh * 1.6} style={s} />
          <rect x={-hw} y={ bh * 1.0} width={w} height={bh * 1.6} style={s} />
          <line x1={hw * 0.4} y1={-hh * 0.9} x2={-hw * 0.4} y2={hh * 0.9}
            stroke={stroke} strokeWidth={sw * 2} />
        </g>
      );
    }

    /* ─── Flowchart ─── */
    case "process":       return <rect x={-hw} y={-hh} width={w} height={h} style={s} />;
    case "io": {
      const sk = Math.min(16, hw * 0.2);
      return <polygon points={`${-hw+sk},${-hh} ${hw},${-hh} ${hw-sk},${hh} ${-hw},${hh}`} style={s} />;
    }
    case "document": {
      const wv = hh * 0.28;
      const d = `M ${-hw},${-hh} L ${hw},${-hh} L ${hw},${hh-wv} Q ${hw*0.5},${hh} 0,${hh-wv} Q ${-hw*0.5},${hh-wv*2} ${-hw},${hh-wv} Z`;
      return <path d={d} style={s} />;
    }
    case "predefined": {
      const pad = 9;
      return (
        <g>
          <rect x={-hw} y={-hh} width={w} height={h} style={s} />
          <line x1={-hw+pad} y1={-hh} x2={-hw+pad} y2={hh} stroke={stroke} strokeWidth={sw} />
          <line x1={hw-pad}  y1={-hh} x2={hw-pad}  y2={hh} stroke={stroke} strokeWidth={sw} />
        </g>
      );
    }
    case "manual_input": {
      const sk = hh * 0.4;
      return <polygon points={`${-hw},${-hh+sk} ${hw},${-hh} ${hw},${hh} ${-hw},${hh}`} style={s} />;
    }
    case "delay": {
      const r = hh;
      return <path d={`M ${-hw},${-hh} L ${hw-r},${-hh} A ${r} ${r} 0 0 1 ${hw-r},${hh} L ${-hw},${hh} Z`} style={s} />;
    }
    case "display_shape": {
      const r = hh, aw = hw * 0.22;
      return <path d={`M ${-hw+aw},0 L ${-hw},${-hh} L ${hw-r},${-hh} A ${r} ${r} 0 0 1 ${hw-r},${hh} L ${-hw},${hh} Z`} style={s} />;
    }
    case "card": {
      const c = hh * 0.35;
      return <polygon points={`${-hw},${-hh} ${hw},${-hh} ${hw},${hh} ${-hw+c},${hh}`} style={s} />;
    }
    case "cylinder": case "database": {
      const ry2 = hh * 0.18;
      return (
        <g>
          <rect x={-hw} y={-hh+ry2} width={w} height={h-ry2*2} style={s} />
          <ellipse rx={hw} ry={ry2} cy={-hh+ry2} style={s} />
          <ellipse rx={hw} ry={ry2} cy={hh-ry2}  style={{ ...s, fill }} />
          <ellipse rx={hw} ry={ry2} cy={-hh+ry2} style={{ fill:"none", stroke, strokeWidth:sw }} />
        </g>
      );
    }
    case "cloud": {
      const puffs = [[0,hh*0.0,hw*0.34],[-hw*0.32,hh*0.12,hw*0.28],[hw*0.32,hh*0.12,hw*0.28],[-hw*0.55,hh*0.03,hw*0.22],[hw*0.55,hh*0.03,hw*0.22],[-hw*0.17,-hh*0.2,hw*0.30],[hw*0.17,-hh*0.2,hw*0.30]];
      return <g>{puffs.map(([cx,cy,r],i)=><circle key={i} cx={cx} cy={cy} r={r} style={s}/>)}</g>;
    }
    case "note": {
      const fold = Math.min(w,h)*0.22;
      return (
        <g>
          <path d={`M ${-hw},${-hh} L ${hw-fold},${-hh} L ${hw},${-hh+fold} L ${hw},${hh} L ${-hw},${hh} Z`} style={s} />
          <path d={`M ${hw-fold},${-hh} L ${hw-fold},${-hh+fold} L ${hw},${-hh+fold}`}
            fill="none" stroke={stroke} strokeWidth={sw} />
        </g>
      );
    }

    /* ─── Stars ─── */
    case "star4":     return <polygon points={star(4, hw, hw*0.3)} style={s} />;
    case "star":      return <polygon points={star(5, hw, hw*0.4)} style={s} />;
    case "star6":     return <polygon points={star(6, hw, hw*0.5)} style={s} />;
    case "star8":     return <polygon points={star(8, hw, hw*0.45)} style={s} />;
    case "star16":    return <polygon points={star(16,hw, hw*0.6)} style={s} />;
    case "explosion": return <polygon points={star(10,hw, hw*0.5)} style={s} />;
    case "explosion2":return <polygon points={star(14,hw, hw*0.55)} style={s} />;
    case "banner_ribbon": {
      const tw = hw * 0.14, th = hh * 0.45;
      return <path d={`M ${-hw},${-hh} L ${hw},${-hh} L ${hw},${hh} L ${hw-tw},${hh-th} L ${-hw+tw},${hh-th} L ${-hw},${hh} Z`} style={s} />;
    }
    case "banner_wave": {
      const wh = hh * 0.3;
      return <path d={`M ${-hw},${-hh} Q ${-hw*0.5},${-hh-wh} 0,${-hh} Q ${hw*0.5},${-hh+wh} ${hw},${-hh} L ${hw},${hh} Q ${hw*0.5},${hh-wh} 0,${hh} Q ${-hw*0.5},${hh+wh} ${-hw},${hh} Z`} style={s} />;
    }
    case "banner_scroll": {
      const rc = hh * 0.35;
      return (
        <g>
          <rect x={-hw+rc} y={-hh} width={w-rc*2} height={h} style={s} />
          <ellipse cx={-hw+rc} rx={rc} ry={hh} style={s} />
          <ellipse cx={hw-rc}  rx={rc} ry={hh} style={s} />
          <ellipse cx={-hw+rc} rx={rc*0.6} ry={hh} fill={fill} stroke="none" />
        </g>
      );
    }
    case "banner_diagonal": {
      const bw = hh * 0.45;
      return <path d={`M ${-hw+bw},${-hh} L ${hw},${-hh} L ${hw-bw},${hh} L ${-hw},${hh} Z`} style={s} />;
    }

    /* ─── Callouts ─── */
    case "callout_rect": {
      const ih = hh * 0.65, tx = -hw * 0.25;
      return <path d={`M ${-hw},${-ih} L ${-hw},${ih} L ${tx-9},${ih} L ${tx},${hh} L ${tx+9},${ih} L ${hw},${ih} L ${hw},${-ih} Z`} style={s} />;
    }
    case "callout_round": {
      const ih = hh * 0.65, tx = -hw * 0.2, rr = 10;
      return <path d={`M ${-hw+rr},${-ih} Q ${-hw},${-ih} ${-hw},${-ih+rr} L ${-hw},${ih-rr} Q ${-hw},${ih} ${-hw+rr},${ih} L ${tx-9},${ih} L ${tx},${hh} L ${tx+9},${ih} L ${hw-rr},${ih} Q ${hw},${ih} ${hw},${ih-rr} L ${hw},${-ih+rr} Q ${hw},${-ih} ${hw-rr},${-ih} Z`} style={s} />;
    }
    case "callout_oval": {
      const tx = hw * 0.2;
      return (
        <g>
          <ellipse rx={hw} ry={hh * 0.7} style={s} />
          <polygon points={`${tx-5},${hh*0.55} ${tx+5},${hh*0.55} ${hw*0.75},${hh*1.2}`} style={{...s}} />
        </g>
      );
    }
    case "callout_cloud":
    case "callout_thought": {
      const off = hh * 0.2;
      const puffs = [[0,-off,hw*0.32],[-hw*0.3,hh*0.08-off,hw*0.26],[hw*0.3,hh*0.08-off,hw*0.26],[-hw*0.52,hh*0.0-off,hw*0.20],[hw*0.52,hh*0.0-off,hw*0.20],[-hw*0.16,-hh*0.22-off,hw*0.28],[hw*0.16,-hh*0.22-off,hw*0.28]];
      const dots = type === "callout_thought"
        ? [[hw*0.35,hh*0.55,5],[hw*0.5,hh*0.82,3.5],[hw*0.62,hh*1.05,2.5]]
        : [[-hw*0.3,hh*0.55,4],[-hw*0.15,hh*0.88,3]];
      return (
        <g>
          {puffs.map(([cx,cy,r],i)=><circle key={i} cx={cx} cy={cy} r={r} style={s}/>)}
          {dots.map(([cx,cy,r],i)=><circle key={`d${i}`} cx={cx} cy={cy} r={r} style={s}/>)}
        </g>
      );
    }
    case "callout_line": {
      const ih = hh * 0.65;
      return (
        <g>
          <rect x={-hw} y={-ih} width={w} height={ih*2} style={s} />
          <line x1={-hw*0.5} y1={ih} x2={-hw*0.7} y2={hh*1.4} stroke={stroke} strokeWidth={sw*1.2} />
        </g>
      );
    }

    default:
      return <rect x={-hw} y={-hh} width={w} height={h} style={s} />;
  }
}

// ── Local-state input for connection label (avoids commit-on-every-keystroke) ──
function ConnLabelInput({ selConnection, updateConn, INP }) {
  const [val, setVal] = useState(selConnection.label);
  useEffect(() => { setVal(selConnection.label); }, [selConnection.id, selConnection.label]);
  return (
    <input value={val} placeholder="Yes / No / data…"
      onChange={e => setVal(e.target.value)}
      onBlur={() => updateConn({ label: val })}
      onKeyDown={e => { if (e.key === "Enter") e.target.blur(); }}
      style={INP}/>
  );
}

function TikzBuilder() {
  const [shapes,       setShapes]       = useState([]);
  const [connections,  setConnections]  = useState([]);
  const [selected,     setSelected]     = useState(null);
  const [selConn,      setSelConn]      = useState(null);
  const [mode,         setMode]         = useState("select");
  const [connStart,    setConnStart]    = useState(null);
  const [editingId,    setEditingId]    = useState(null);
  const [editText,     setEditText]     = useState("");
  const [arrowStyle,   setArrowStyle]   = useState("->");
  const [showGrid,     setShowGrid]     = useState(true);
  const [showCode,     setShowCode]     = useState(true);
  const [copied,       setCopied]       = useState(false);
  const [dragging,     setDragging]     = useState(null);
  const [dragOff,      setDragOff]      = useState({x:0,y:0});
  const [leftTab,      setLeftTab]      = useState("shapes"); // "shapes"|"smartart"
  const [shapeGroup,   setShapeGroup]   = useState("Rectangles");
  const [saCategory,   setSaCategory]   = useState("List");
  const [recentTypes,  setRecentTypes]  = useState([]);
  const [canUndo,      setCanUndo]      = useState(false);
  const [canRedo,      setCanRedo]      = useState(false);

  const histRef   = useRef([{shapes:[],connections:[]}]);
  const histIdx   = useRef(0);
  const shapesRef = useRef(shapes);
  const connsRef  = useRef(connections);
  const svgRef    = useRef(null);
  const inputRef  = useRef(null);
  shapesRef.current = shapes;
  connsRef.current  = connections;

  const commit = useCallback((ns, nc) => {
    const h = histRef.current.slice(0, histIdx.current + 1);
    h.push({shapes:ns, connections:nc});
    if (h.length > 60) h.shift();
    histRef.current = h;
    histIdx.current = h.length - 1;
    setShapes(ns); setConnections(nc);
    setCanUndo(histIdx.current > 0);
    setCanRedo(false);
  }, []);

  const undo = useCallback(() => {
    if (histIdx.current > 0) {
      histIdx.current--;
      const p = histRef.current[histIdx.current];
      setShapes(p.shapes); setConnections(p.connections);
      setCanUndo(histIdx.current > 0); setCanRedo(true);
    }
  },[]);
  const redo = useCallback(() => {
    if (histIdx.current < histRef.current.length - 1) {
      histIdx.current++;
      const p = histRef.current[histIdx.current];
      setShapes(p.shapes); setConnections(p.connections);
      setCanUndo(true); setCanRedo(histIdx.current < histRef.current.length-1);
    }
  },[]);

  const addShape = (def) => {
    const s = { id:newId(), type:def.type, label:def.label, x:snapTo(CANVAS_W/2), y:snapTo(CANVAS_H/2), w:def.w, h:def.h, colorIdx:0 };
    commit([...shapesRef.current, s], connsRef.current);
    setSelected(s.id); setMode("select");
    setRecentTypes(prev => [def, ...prev.filter(d=>d.type!==def.type)].slice(0,8));
  };

  const loadTemplate = (tpl) => {
    const idMap = {};
    const ns = tpl.shapes.map(s => { const nid=newId(); idMap[s.id]=nid; return {...s,id:nid}; });
    const nc = tpl.connections.map(c => ({...c, id:newId(), from:idMap[c.from], to:idMap[c.to]}));
    commit(ns, nc); setSelected(null); setSelConn(null);
  };

  const getSvgPt = e => {
    const r = svgRef.current.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  const onShapeDown = (e, id) => {
    e.stopPropagation();
    if (mode === "connect") {
      if (!connStart) { setConnStart(id); return; }
      if (connStart !== id) {
        const dup = connsRef.current.find(c=>c.from===connStart && c.to===id);
        if (!dup) commit(shapesRef.current, [...connsRef.current, {id:newId(),from:connStart,to:id,label:"",style:arrowStyle}]);
        setConnStart(null); setMode("select");
      }
      return;
    }
    setSelected(id); setSelConn(null);
    const shape = shapesRef.current.find(s=>s.id===id);
    const pt = getSvgPt(e);
    setDragging(id); setDragOff({x:pt.x-shape.x, y:pt.y-shape.y});
  };

  const onSvgMove = e => {
    if (!dragging) return;
    const pt = getSvgPt(e);
    const nx = snapTo(Math.max(50,Math.min(CANVAS_W-50, pt.x-dragOff.x)));
    const ny = snapTo(Math.max(35,Math.min(CANVAS_H-35, pt.y-dragOff.y)));
    setShapes(ss => ss.map(s => s.id===dragging ? {...s,x:nx,y:ny} : s));
  };
  const onSvgUp = () => { if (dragging) { commit(shapesRef.current, connsRef.current); setDragging(null); } };
  const onSvgClick = e => { const t=e.target; if (t===svgRef.current||t.tagName==="svg"||t.classList.contains("canvas-bg")) { setSelected(null); setSelConn(null); setConnStart(null); } };

  const onDblClick = (e, id) => {
    e.stopPropagation();
    const sh = shapesRef.current.find(s=>s.id===id);
    setEditingId(id); setEditText(sh.label);
    setTimeout(()=>inputRef.current?.focus(),30);
  };
  const commitLabel = () => {
    if (!editingId) return;
    commit(shapesRef.current.map(s=>s.id===editingId?{...s,label:editText}:s), connsRef.current);
    setEditingId(null);
  };

  useEffect(()=>{
    const h = e => {
      if (editingId) return;
      if ((e.key==="Delete"||e.key==="Backspace") && document.activeElement===document.body) {
        if (selected) { commit(shapesRef.current.filter(s=>s.id!==selected), connsRef.current.filter(c=>c.from!==selected&&c.to!==selected)); setSelected(null); }
        if (selConn)  { commit(shapesRef.current, connsRef.current.filter(c=>c.id!==selConn)); setSelConn(null); }
      }
      if (e.ctrlKey&&e.key==="z"){e.preventDefault();undo();}
      if (e.ctrlKey&&(e.key==="y"||(e.shiftKey&&e.key==="Z"))){e.preventDefault();redo();}
      if (e.key==="Escape"){setConnStart(null);setMode("select");}
      if (e.key==="v"&&!e.ctrlKey&&mode!=="connect") setMode("select");
      if (e.key==="c"&&!e.ctrlKey&&mode!=="connect") setMode("connect");
    };
    window.addEventListener("keydown",h);
    return ()=>window.removeEventListener("keydown",h);
  },[selected,selConn,editingId,commit,undo,redo,mode]);

  const copyCode = async () => {
    const code = generateTikz(shapes,connections);
    let ok=false;
    try{await navigator.clipboard.writeText(code);ok=true;}catch{}
    if(!ok){try{const ta=document.createElement("textarea");ta.value=code;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.focus();ta.select();document.execCommand("copy");document.body.removeChild(ta);ok=true;}catch{}}
    if(ok){setCopied(true);setTimeout(()=>setCopied(false),2200);}
  };

  const selShape = shapes.find(s=>s.id===selected);
  const selConnection = connections.find(c=>c.id===selConn);
  const tikzCode = generateTikz(shapes,connections);
  const GROUPS = [...new Set(SHAPE_PALETTE.map(s=>s.g))];
  const SA_CATS = Object.keys(SMARTART);

  const updateSel  = patch => commit(shapes.map(s=>s.id===selected?{...s,...patch}:s), connections);
  const updateConn = patch => commit(shapes, connections.map(c=>c.id===selConn?{...c,...patch}:c));

  const INP = { width:"100%", background:"#0d1830", border:"1px solid #1a2d50", color:"#c8d8f8", borderRadius:5, padding:"5px 8px", fontSize:11, fontFamily:"inherit", boxSizing:"border-box", outline:"none" };

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",background:"#0c1015",color:"#e2e8f0",fontFamily:"'IBM Plex Mono','Fira Code','Courier New',monospace",overflow:"hidden"}}>

      {/* ════ TOP BAR ════════════════════════════════════════════ */}
      <div style={{background:"#0f1520",borderBottom:"1px solid #1a2440",padding:"7px 14px",display:"flex",alignItems:"center",gap:8,flexShrink:0,flexWrap:"wrap"}}>
        <svg width={22} height={22} viewBox="0 0 22 22">
          <circle cx={11} cy={11} r={10} fill="none" stroke="#3b82f6" strokeWidth={1.5}/>
          <path d="M5 11 Q11 4 17 11 Q11 18 5 11Z" fill="#3b82f6" opacity={0.3}/>
          <circle cx={11} cy={11} r={2.5} fill="#7ab8ff"/>
        </svg>
        <span style={{fontSize:13,fontWeight:800,color:"#f1f5f9",letterSpacing:"-0.5px",marginRight:4}}>
          TikZ<span style={{color:"#3b82f6"}}>Builder</span>
          <span style={{fontSize:9,color:"#3a4f70",marginLeft:8}}>for Overleaf · A4</span>
        </span>
        <div style={{width:1,height:22,background:"#1a2440"}}/>
        {[{id:"select",icon:"✦",label:"Select",tip:"Select / move  (V)"},{id:"connect",icon:"⇢",label:"Connect",tip:"Connect shapes  (C)"}].map(m=>(
          <Btn key={m.id} active={mode===m.id} title={m.tip} onClick={()=>{setMode(m.id);setConnStart(null);}}>
            {m.icon} {m.label}
          </Btn>
        ))}
        <select value={arrowStyle} onChange={e=>setArrowStyle(e.target.value)} title="Arrow style"
          style={{background:"#1a2240",border:"1px solid #2a3560",color:"#94a3b8",borderRadius:6,padding:"5px 8px",fontSize:11,fontFamily:"inherit",cursor:"pointer"}}>
          {ARROW_TYPES.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
        </select>
        <div style={{width:1,height:22,background:"#1a2440"}}/>
        <Btn onClick={undo} disabled={!canUndo} title="Undo (Ctrl+Z)">↩ Undo</Btn>
        <Btn onClick={redo} disabled={!canRedo} title="Redo (Ctrl+Y)">↪ Redo</Btn>
        <div style={{width:1,height:22,background:"#1a2440"}}/>
        <Btn onClick={()=>setShowGrid(v=>!v)} active={showGrid} title="Toggle dot grid">⊞ Grid</Btn>
        <Btn danger onClick={()=>{commit([],[]);setSelected(null);setSelConn(null);}} title="Clear canvas">✕ Clear</Btn>
        <div style={{flex:1}}/>
        <Btn onClick={()=>setShowCode(v=>!v)}>{showCode?"▸ Hide Code":"◂ Show Code"}</Btn>
      </div>

      {/* ════ BODY ══════════════════════════════════════════════ */}
      <div style={{display:"flex",flex:1,overflow:"hidden"}}>

        {/* ── LEFT PANEL ─────────────────────────────────────── */}
        <div style={{width:210,background:"#0e1520",borderRight:"1px solid #1a2440",display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0}}>
          {/* Main tabs: Shapes | SmartArt */}
          <div style={{display:"flex",borderBottom:"1px solid #1a2440",flexShrink:0}}>
            {[{id:"shapes",label:"Shapes"},{ id:"smartart",label:"SmartArt"}].map(t=>(
              <button key={t.id} onClick={()=>setLeftTab(t.id)} style={{
                flex:1,background:"transparent",border:"none",
                borderBottom:`2px solid ${leftTab===t.id?"#3b82f6":"transparent"}`,
                color:leftTab===t.id?"#7ab8ff":"#4a5a78",
                padding:"9px 4px",cursor:"pointer",fontSize:11,fontFamily:"inherit",fontWeight:700,
              }}>{t.label}</button>
            ))}
          </div>

          {leftTab === "shapes" && (
            <>
              {/* Recent shapes */}
              {recentTypes.length > 0 && (
                <div style={{padding:"6px 8px",flexShrink:0}}>
                  <div style={{fontSize:9,fontWeight:700,color:"#3a4f70",letterSpacing:"1px",marginBottom:5}}>RECENTLY USED</div>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                    {recentTypes.map((def,i)=>(
                      <button key={i} title={def.label} onClick={()=>addShape(def)}
                        style={{background:"#111d30",border:"1px solid #1a2d50",borderRadius:5,padding:4,cursor:"pointer",lineHeight:0}}>
                        <MiniPreview type={def.type}/>
                      </button>
                    ))}
                  </div>
                </div>
              )}
              {/* Group selector */}
              <div style={{padding:"6px 8px 4px",flexShrink:0}}>
                <select value={shapeGroup} onChange={e=>setShapeGroup(e.target.value)}
                  style={{...INP,background:"#111d30",border:"1px solid #1a2d50",color:"#7a98c8",padding:"5px 8px",cursor:"pointer"}}>
                  {GROUPS.map(g=><option key={g} value={g}>{g}</option>)}
                </select>
              </div>
              {/* Shape list */}
              <div style={{flex:1,overflowY:"auto",padding:"4px 6px 8px",display:"flex",flexDirection:"column",gap:3}}>
                {SHAPE_PALETTE.filter(s=>s.g===shapeGroup).map(def=>(
                  <button key={def.type} onClick={()=>addShape(def)} style={{
                    background:"#111d30",border:"1px solid #1a2d50",borderRadius:6,
                    color:"#8aaad8",padding:"6px 10px",cursor:"pointer",
                    fontSize:11,fontFamily:"inherit",textAlign:"left",
                    display:"flex",alignItems:"center",gap:9,transition:"background .1s",
                  }}>
                    <MiniPreview type={def.type}/>{def.label}
                  </button>
                ))}
              </div>
            </>
          )}

          {leftTab === "smartart" && (
            <>
              {/* SmartArt category */}
              <div style={{padding:"6px 8px 4px",flexShrink:0}}>
                <select value={saCategory} onChange={e=>setSaCategory(e.target.value)}
                  style={{...INP,background:"#111d30",border:"1px solid #1a2d50",color:"#7a98c8",padding:"5px 8px",cursor:"pointer"}}>
                  {SA_CATS.map(c=><option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <div style={{flex:1,overflowY:"auto",padding:"4px 6px 8px",display:"flex",flexDirection:"column",gap:5}}>
                {(SMARTART[saCategory]||[]).map(tpl=>(
                  <button key={tpl.name} onClick={()=>loadTemplate(tpl)} style={{
                    background:"#111d30",border:"1px solid #1a2d50",borderRadius:7,
                    color:"#8aaad8",padding:"9px 10px",cursor:"pointer",
                    fontSize:11,fontFamily:"inherit",textAlign:"left",
                    transition:"background .1s",
                  }}>
                    <div style={{fontWeight:700,color:"#7ab8ff",marginBottom:3}}>📊 {tpl.name}</div>
                    <div style={{fontSize:9,color:"#4a5a78",lineHeight:1.5}}>{tpl.desc}</div>
                  </button>
                ))}
                <div style={{height:1,background:"#1a2440",margin:"4px 0"}}/>
                <div style={{fontSize:9,fontWeight:700,color:"#3a4f70",letterSpacing:"1px",padding:"4px 2px"}}>QUICK TEMPLATES</div>
                {QUICK_TEMPLATES.map(tpl=>(
                  <button key={tpl.name} onClick={()=>loadTemplate(tpl)} style={{
                    background:"#111d30",border:"1px solid #1a2d50",borderRadius:7,
                    color:"#8aaad8",padding:"9px 10px",cursor:"pointer",
                    fontSize:11,fontFamily:"inherit",textAlign:"left",
                  }}>
                    <div style={{fontWeight:700,color:"#7ab8ff",marginBottom:3}}>📐 {tpl.name}</div>
                  </button>
                ))}
              </div>
            </>
          )}
        </div>

        {/* ── CANVAS — A4 white page ─────────────────────────── */}
        <div style={{flex:1,overflow:"auto",position:"relative",background:"#525659",display:"flex",justifyContent:"center",alignItems:"flex-start",padding:"24px 20px"}}>
          <div style={{position:"relative",flexShrink:0}}>
          {mode==="connect" && (
            <div style={{position:"fixed",top:70,left:"50%",transform:"translateX(-50%)",zIndex:50,
              background:connStart?"#4c1d95":"#1e3a8a",color:connStart?"#c4b5fd":"#93c5fd",
              border:`1px solid ${connStart?"#7c3aed":"#2563eb"}`,
              borderRadius:20,padding:"5px 18px",fontSize:11,zIndex:20,pointerEvents:"none"}}>
              {connStart?"✓ Source selected — click the target shape":"Click a shape to start the connection"}
            </div>
          )}
          {shapes.length===0 && (
            <div style={{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",textAlign:"center",pointerEvents:"none",userSelect:"none",zIndex:5}}>
              <div style={{fontSize:48,opacity:0.1,marginBottom:12}}>⬡</div>
              <div style={{fontSize:13,color:"#2a3a5a",lineHeight:1.9}}>
                Pick a shape from the left panel<br/>
                or choose a SmartArt layout
              </div>
            </div>
          )}
          <svg ref={svgRef} width={CANVAS_W} height={CANVAS_H}
            onMouseMove={onSvgMove} onMouseUp={onSvgUp} onMouseLeave={onSvgUp}
            onClick={onSvgClick}
            style={{display:"block",cursor:mode==="connect"?"crosshair":"default",userSelect:"none",
              background:"white",
              boxShadow:"0 4px 20px rgba(0,0,0,0.35), 0 1px 4px rgba(0,0,0,0.2)",
              border:"1px solid #bdbdbd",
            }}>
            <defs>
              <pattern id="dotgrid" width={SNAP} height={SNAP} patternUnits="userSpaceOnUse">
                <circle cx={SNAP/2} cy={SNAP/2} r={0.7} fill="#b0bec5"/>
              </pattern>
              {[{id:"arr",col:"#374151"},{id:"arr-s",col:"#3b82f6"},{id:"arr-c",col:"#7c3aed"}].map(({id,col})=>(
                <marker key={id} id={id} markerWidth={9} markerHeight={7} refX={9} refY={3.5} orient="auto">
                  <polygon points="0 0, 9 3.5, 0 7" fill={col}/>
                </marker>
              ))}
            </defs>
            {/* Always-white paper background */}
            <rect width={CANVAS_W} height={CANVAS_H} fill="white" className="canvas-bg"/>
            {/* Optional dot grid overlay */}
            {showGrid && <rect width={CANVAS_W} height={CANVAS_H} fill="url(#dotgrid)" pointerEvents="none"/>}
            {/* A4 margin guides (10mm each side ≈ 38px) */}
            <rect x={38} y={38} width={CANVAS_W-76} height={CANVAS_H-76}
              fill="none" stroke="#e8eaf0" strokeWidth={0.5} strokeDasharray="4 4"
              pointerEvents="none"/>

            {/* Connections */}
            {connections.map(c=>{
              const from=shapes.find(s=>s.id===c.from), to=shapes.find(s=>s.id===c.to);
              if(!from||!to) return null;
              const p1=getEdgePoint(from,to.x,to.y), p2=getEdgePoint(to,from.x,from.y);
              const mid={x:(p1.x+p2.x)/2,y:(p1.y+p2.y)/2};
              const isSel=c.id===selConn;
              const isDash=c.style.includes("dashed")||c.style.includes("dotted");
              const isThick=c.style.includes("thick");
              const hasArr=c.style!=="";
              const mEnd=hasArr?(isSel?"url(#arr-s)":"url(#arr)"):undefined;
              const mStart=c.style.includes("<->")?( isSel?"url(#arr-s)":"url(#arr)"):undefined;
              return (
                <g key={c.id} style={{cursor:"pointer"}} onClick={e=>{e.stopPropagation();setSelConn(c.id);setSelected(null);}}>
                  <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke="transparent" strokeWidth={14}/>
                  <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y}
                    stroke={isSel?"#1d4ed8":"#374151"}
                    strokeWidth={isSel?2.5:isThick?2.5:1.5}
                    strokeDasharray={isDash?(c.style.includes("dotted")?"2 4":"7 4"):undefined}
                    markerEnd={mEnd} markerStart={mStart}/>
                  {c.label && (
                    <g>
                      <rect x={mid.x-c.label.length*3.5-4} y={mid.y-9} width={c.label.length*7+8} height={15} fill="#0d1420" rx={3}/>
                      <text x={mid.x} y={mid.y+1} textAnchor="middle" dominantBaseline="central" fontSize={10} fill="#94a3b8" style={{pointerEvents:"none"}}>{c.label}</text>
                    </g>
                  )}
                  {isSel && <circle cx={mid.x} cy={mid.y} r={4} fill="#3b82f6"/>}
                </g>
              );
            })}

            {/* Connect-start ring */}
            {connStart && (()=>{ const sh=shapes.find(s=>s.id===connStart); return sh?(<circle cx={sh.x} cy={sh.y} r={Math.max(sh.w,sh.h)/2+8} fill="none" stroke="#7c3aed" strokeWidth={2} strokeDasharray="5 3"/>):null; })()}

            {/* Shapes */}
            {shapes.map(s=>{
              const col=COLORS[s.colorIdx??0], isSel=s.id===selected;
              return (
                <g key={s.id} transform={`translate(${s.x},${s.y})`}
                  onMouseDown={e=>onShapeDown(e,s.id)}
                  onDoubleClick={e=>onDblClick(e,s.id)}
                  style={{cursor:mode==="connect"?"crosshair":dragging===s.id?"grabbing":"grab"}}>
                  {isSel&&<rect x={-s.w/2-5} y={-s.h/2-5} width={s.w+10} height={s.h+10} fill="none" stroke="#2563eb" strokeWidth={2} strokeDasharray="5 3" rx={5}/>}
                  <ShapeBody type={s.type} w={s.w} h={s.h} fill={col.fill} stroke={col.stroke}/>
                  {editingId===s.id ? (
                    <foreignObject x={-s.w/2} y={-s.h/2} width={s.w} height={s.h}>
                      <div xmlns="http://www.w3.org/1999/xhtml" style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        <input ref={inputRef} value={editText} onChange={e=>setEditText(e.target.value)}
                          onBlur={commitLabel}
                          onKeyDown={e=>{if(e.key==="Enter")commitLabel();if(e.key==="Escape")setEditingId(null);}}
                          style={{width:"90%",background:"rgba(255,255,255,0.95)",border:"2px solid #3b82f6",borderRadius:4,textAlign:"center",fontSize:11,padding:"2px 4px",outline:"none",fontFamily:"inherit"}}/>
                      </div>
                    </foreignObject>
                  ) : (
                    <text textAnchor="middle" dominantBaseline="central"
                      fontSize={s.label.length>14?9:11} fill={col.stroke}
                      style={{pointerEvents:"none",userSelect:"none",fontWeight:600}}>
                      {s.label.length>18?s.label.slice(0,16)+"…":s.label}
                    </text>
                  )}
                  {isSel&&(
                    <rect x={s.w/2-5} y={s.h/2-5} width={10} height={10} fill="#3b82f6" rx={2} style={{cursor:"se-resize"}}
                      onMouseDown={e=>{
                        e.stopPropagation();
                        const sx=e.clientX,sy=e.clientY,sw2=s.w,sh2=s.h;
                        const mv=me=>{const nw=Math.max(40,snapTo(sw2+(me.clientX-sx)));const nh=Math.max(30,snapTo(sh2+(me.clientY-sy)));setShapes(ss=>ss.map(sh=>sh.id===s.id?{...sh,w:nw,h:nh}:sh));};
                        const up=()=>{commit(shapesRef.current,connsRef.current);window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);};
                        window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);
                      }}/>
                  )}
                </g>
              );
            })}
          </svg>
          </div>
        </div>

        {/* ── RIGHT PANEL ────────────────────────────────────── */}
        {showCode && (
          <div style={{width:288,background:"#0e1520",borderLeft:"1px solid #1a2440",display:"flex",flexDirection:"column",overflow:"hidden",flexShrink:0}}>

            {/* Properties */}
            <div style={{borderBottom:"1px solid #1a2440",padding:"10px 12px",flexShrink:0,maxHeight:320,overflowY:"auto"}}>
              <div style={{fontSize:9,fontWeight:700,color:"#3a4f70",letterSpacing:"1px",marginBottom:8}}>PROPERTIES</div>
              {selShape ? (
                <div style={{display:"flex",flexDirection:"column",gap:9}}>
                  <div style={{fontSize:10,color:"#4f8ef7"}}>{selShape.type} · <span style={{color:"#3a4f70"}}>{selShape.id}</span></div>
                  <div>
                    <div style={{fontSize:9,color:"#3a4f70",marginBottom:3}}>LABEL</div>
                    <input value={selShape.label}
                      onChange={e=>setShapes(ss=>ss.map(s=>s.id===selected?{...s,label:e.target.value}:s))}
                      onBlur={()=>commit(shapesRef.current,connsRef.current)} style={INP}/>
                  </div>
                  <div>
                    <div style={{fontSize:9,color:"#3a4f70",marginBottom:5}}>FILL COLOR</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                      {COLORS.map((c,i)=>(
                        <button key={i} title={c.label} onClick={()=>updateSel({colorIdx:i})} style={{
                          width:22,height:22,borderRadius:"50%",background:c.fill,
                          border:`2px solid ${selShape.colorIdx===i?c.stroke:"#1a2440"}`,
                          cursor:"pointer",padding:0,
                          boxShadow:selShape.colorIdx===i?`0 0 0 1px ${c.stroke}`:"none",
                        }}/>
                      ))}
                    </div>
                  </div>
                  <div style={{display:"flex",gap:7}}>
                    {[["W","w"],["H","h"]].map(([lbl,key])=>(
                      <div key={key} style={{flex:1}}>
                        <div style={{fontSize:9,color:"#3a4f70",marginBottom:3}}>{lbl} (px)</div>
                        <input type="number" min={30} max={400} value={selShape[key]}
                          onChange={e=>setShapes(ss=>ss.map(s=>s.id===selected?{...s,[key]:Math.max(30,parseInt(e.target.value)||s[key])}:s))}
                          onBlur={()=>commit(shapesRef.current,connsRef.current)}
                          style={INP}/>
                      </div>
                    ))}
                  </div>
                  <div style={{fontSize:9,color:"#3a4f70"}}>Node ID in TikZ: <span style={{color:"#4f8ef7"}}>({selShape.id})</span></div>
                  <Btn danger onClick={()=>{commit(shapes.filter(s=>s.id!==selected),connections.filter(c=>c.from!==selected&&c.to!==selected));setSelected(null);}}>
                    🗑 Delete Shape
                  </Btn>
                </div>
              ) : selConnection ? (
                <div style={{display:"flex",flexDirection:"column",gap:9}}>
                  <div style={{fontSize:10,color:"#4f8ef7"}}>Connection: <span style={{color:"#94a3b8"}}>{selConnection.from} → {selConnection.to}</span></div>
                  <div>
                    <div style={{fontSize:9,color:"#3a4f70",marginBottom:3}}>LABEL</div>
                    <ConnLabelInput selConnection={selConnection} updateConn={updateConn} INP={INP}/>
                  </div>
                  <div>
                    <div style={{fontSize:9,color:"#3a4f70",marginBottom:3}}>ARROW STYLE</div>
                    <select value={selConnection.style} onChange={e=>updateConn({style:e.target.value})}
                      style={{...INP,cursor:"pointer"}}>
                      {ARROW_TYPES.map(a=><option key={a.id} value={a.id}>{a.label}</option>)}
                    </select>
                  </div>
                  <Btn danger onClick={()=>{commit(shapes,connections.filter(c=>c.id!==selConn));setSelConn(null);}}>
                    🗑 Delete Connection
                  </Btn>
                </div>
              ) : (
                <div style={{fontSize:11,color:"#2a3a5a",lineHeight:1.9}}>
                  Click a shape or arrow to edit.<br/>
                  Double-click to rename.<br/>
                  Delete key removes selection.<br/>
                  Drag corner ■ to resize.
                </div>
              )}
            </div>

            {/* TikZ Code */}
            <div style={{flex:1,display:"flex",flexDirection:"column",padding:"10px 12px",overflow:"hidden",minHeight:0}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7,flexShrink:0}}>
                <div style={{fontSize:9,fontWeight:700,color:"#3a4f70",letterSpacing:"1px"}}>TIKZ CODE</div>
                <button onClick={copyCode} style={{
                  background:copied?"#14532d":"#1a2d50",
                  border:`1px solid ${copied?"#16a34a":"#2a4080"}`,
                  color:copied?"#4ade80":"#7ab8ff",
                  borderRadius:5,padding:"4px 11px",cursor:"pointer",
                  fontSize:10,fontFamily:"inherit",fontWeight:700,transition:"all .2s",
                }}>{copied?"✓ Copied!":"⎘ Copy"}</button>
              </div>
              <textarea readOnly value={tikzCode} style={{
                flex:1,background:"#070c14",border:"1px solid #1a2440",
                color:"#7dd3fc",borderRadius:6,padding:"10px 12px",
                fontSize:9.5,fontFamily:"'Fira Code','Cascadia Code','Courier New',monospace",
                resize:"none",lineHeight:1.65,outline:"none",minHeight:0,
              }}/>
              <div style={{fontSize:9,color:"#2a3a5a",marginTop:7,lineHeight:1.7,flexShrink:0}}>
                Paste into Overleaf. Preamble:<br/>
                <code style={{color:"#3a5070"}}>\usepackage{"{"} tikz {"}"}</code><br/>
                <code style={{color:"#3a5070"}}>\usetikzlibrary{"{"} shapes.geometric, shapes.misc, shapes.arrows, shapes.callouts, arrows.meta {"}"}</code>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(TikzBuilder)
);
</script>
</body>
</html>
