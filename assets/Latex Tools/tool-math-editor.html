/* ═══════════════════════════════════════════════════════════════════
   KATEX LOADER
═══════════════════════════════════════════════════════════════════ */
function useKatex() {
  const [ready, setReady] = useState(false);
  useEffect(() => {
    if (window.katex) { setReady(true); return; }
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css";
    document.head.appendChild(link);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js";
    s.onload = () => setReady(true);
    document.head.appendChild(s);
  }, []);
  return ready;
}


function KatexRender({ latex, display = false, style = {} }) {
  const ref = useRef(null);
  const ready = useKatex();
  useEffect(() => {
    if (!ready || !ref.current) return;
    try {
      window.katex.render(latex || "\\square", ref.current, {
        displayMode: display, throwOnError: false, errorColor: "#ff6b6b",
      });
    } catch {}
  }, [latex, display, ready]);
  return <span ref={ref} style={style} />;
}

  { name: "Fourier Transform", latex: "\\hat{f}(\\xi) = \\int_{-\\infty}^{\\infty} f(x)\\, e^{-2\\pi ix\\xi}\\,dx" },
  { name: "Taylor Series", latex: "f(x) = \\sum_{n=0}^{\\infty} \\frac{f^{(n)}(a)}{n!}(x-a)^n" },
  { name: "Normal Distribution", latex: "f(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}}e^{-\\frac{1}{2}\\left(\\frac{x-\\mu}{\\sigma}\\right)^2}" },
  { name: "Gauss's Law", latex: "\\oint_{\\partial V} \\vec{E} \\cdot d\\vec{A} = \\frac{Q}{\\varepsilon_0}" },
  { name: "Matrix Eigenvalue", latex: "\\det(A - \\lambda I) = \\begin{vmatrix} a-\\lambda & b \\\\ c & d-\\lambda \\end{vmatrix} = 0" },
  { name: "Cauchy–Schwarz", latex: "\\left|\\langle u,v\\rangle\\right|^2 \\leq \\langle u,u\\rangle \\cdot \\langle v,v\\rangle" },
];

/* ═══════════════════════════════════════════════════════════════════
   MATRIX BUILDER DIALOG
═══════════════════════════════════════════════════════════════════ */
function MatrixBuilder({ onInsert, onClose }) {
  const [rows, setRows] = useState(2);
  const [cols, setCols] = useState(2);
  const [delim, setDelim] = useState("pmatrix");
  const [cells, setCells] = useState(() => Array(4).fill(""));

  const resize = (r, c) => {
    const newCells = Array(r * c).fill("").map((_, i) => {
      const row = Math.floor(i / c), col = i % c;
      const oldIdx = row * cols + col;
      return (row < rows && col < Math.min(cols, c)) ? (cells[oldIdx] || "") : "";
    });
    setRows(r); setCols(c); setCells(newCells);
  };

  const setCell = (i, v) => setCells(c => c.map((x, j) => j === i ? v : x));

  const build = () => {
    const rowStrs = [];
    for (let r = 0; r < rows; r++) {
      rowStrs.push(cells.slice(r * cols, r * cols + cols).join(" & "));
    }
    return `\\begin{${delim}} ${rowStrs.join(" \\\\ ")} \\end{${delim}}`;
  };

  const DELIMS = [
    { val: "pmatrix", label: "( )" },
    { val: "bmatrix", label: "[ ]" },
    { val: "vmatrix", label: "| |" },
    { val: "Vmatrix", label: "‖ ‖" },
    { val: "Bmatrix", label: "{ }" },
    { val: "matrix",  label: "plain" },
  ];

  return (
    <div style={mb.overlay}>
      <div style={mb.box}>
        <div style={mb.header}>
          <span style={mb.title}>Matrix Builder</span>
          <button style={mb.closeBtn} onClick={onClose}>✕</button>
        </div>
        <div style={mb.controls}>
          <label style={mb.label}>Rows</label>
          <input type="number" min={1} max={6} value={rows} style={mb.numInput}
            onChange={e => resize(Math.min(6, Math.max(1, +e.target.value)), cols)} />
          <label style={mb.label}>Cols</label>
          <input type="number" min={1} max={6} value={cols} style={mb.numInput}
            onChange={e => resize(rows, Math.min(6, Math.max(1, +e.target.value)))} />
          <label style={mb.label}>Delimiter</label>
          <select value={delim} style={mb.select} onChange={e => setDelim(e.target.value)}>
            {DELIMS.map(d => <option key={d.val} value={d.val}>{d.label}</option>)}
          </select>
        </div>
        <div style={{ ...mb.grid, gridTemplateColumns: `repeat(${cols}, 1fr)` }}>
          {cells.map((v, i) => (
            <input key={i} value={v} style={mb.cell}
              placeholder={`a_{${Math.floor(i/cols)+1}${i%cols+1}}`}
              onChange={e => setCell(i, e.target.value)} />
          ))}
        </div>
        <div style={mb.preview}>
          <KatexRender latex={build()} display={false} />
        </div>
        <div style={mb.footer}>
          <button style={mb.insertBtn} onClick={() => { onInsert(build()); onClose(); }}>Insert Matrix</button>
          <button style={mb.cancelBtn} onClick={onClose}>Cancel</button>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════
   MAIN APP
═══════════════════════════════════════════════════════════════════ */
function MathEditor() {
  const [latex, setLatex] = useState("x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}");
  const [activeGroup, setActiveGroup] = useState("fractions");
  const [copied, setCopied] = useState(null);
  const [history, setHistory] = useState(["x = \\frac{-b \\pm \\sqrt{b^2 - 4ac}}{2a}"]);
  const [histIdx, setHistIdx] = useState(0);
  const [showExamples, setShowExamples] = useState(false);
  const [showMatrix, setShowMatrix] = useState(false);
  const [displayMode, setDisplayMode] = useState(true);
  const [previewBg, setPreviewBg] = useState("white");
  const textareaRef = useRef(null);
  const previewRef = useRef(null);
  const katexReady = useKatex();

  const pushHistory = useCallback((val) => {
    setHistory(h => {
      const next = [...h.slice(0, histIdx + 1), val].slice(-80);
      setHistIdx(next.length - 1);
      return next;
    });
  }, [histIdx]);

  const handleChange = (e) => { setLatex(e.target.value); pushHistory(e.target.value); };
  const undo = () => { if (histIdx > 0) { const i = histIdx - 1; setHistIdx(i); setLatex(history[i]); } };
  const redo = () => { if (histIdx < history.length - 1) { const i = histIdx + 1; setHistIdx(i); setLatex(history[i]); } };

  const insertAt = (snippet) => {
    const ta = textareaRef.current;
    if (!ta) return;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const next = latex.slice(0, start) + snippet + latex.slice(end);
    setLatex(next);
    pushHistory(next);
    setTimeout(() => { ta.focus(); ta.setSelectionRange(start + snippet.length, start + snippet.length); }, 0);
  };



  const downloadImage = async () => {
    if (!previewRef.current) return;
    setCopied("img");
    try {
      const { default: html2canvas } = await import("https://cdn.skypack.dev/html2canvas@1.4.1");
      const canvas = await html2canvas(previewRef.current, {
        backgroundColor: previewBg === "black" ? "#000000" : previewBg === "#f5f5f5" ? "#f5f5f5" : "#ffffff",
        scale: 3, useCORS: true, logging: false,
      });
      const a = document.createElement("a");
      a.download = "equation.png";
      a.href = canvas.toDataURL("image/png");
      a.click();
    } catch(e) { console.error(e); }
    setTimeout(() => setCopied(null), 2000);
  };

  const copy = async (text, key) => {
    let success = false;
    try {
      await navigator.clipboard.writeText(text);
      success = true;
    } catch {}
    if (!success) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        success = document.execCommand("copy");
        document.body.removeChild(ta);
      } catch {}
    }
    if (success) {
      setCopied(key);
      setTimeout(() => setCopied(null), 1800);
    }
  };

  const activeItems = useMemo(() => TOOLBAR_GROUPS.find(g => g.id === activeGroup)?.items || [], [activeGroup]);

  const previewStyle = {
    background: previewBg,
    color: previewBg === "black" ? "#fff" : "#111",
  };

  return (
    <div style={S.root}>
      {/* ── TOP BAR ── */}
      <header style={S.header}>
        <div style={S.logo}>
          <span style={S.logoSigma}>∑</span>
          <div>
            <div style={S.logoName}>MathScript Pro</div>
            <div style={S.logoSub}>Advanced Equation Editor</div>
          </div>
        </div>
        <div style={S.topControls}>
          <button style={S.topBtn} onClick={() => setShowExamples(v => !v)}>
            📐 Examples {showExamples ? "▲" : "▼"}
          </button>
          <button style={S.topBtn} onClick={() => setShowMatrix(true)}>
            🔢 Matrix Builder
          </button>
          <div style={S.bgToggle}>
            <span style={S.bgLabel}>Preview bg:</span>
            {["white", "#f5f5f5", "black"].map(bg => (
              <button key={bg} style={{ ...S.bgBtn, background: bg, outline: previewBg === bg ? "2px solid #4f8ef7" : "none" }}
                onClick={() => setPreviewBg(bg)} />
            ))}
          </div>
          <label style={S.toggleLabel}>
            <input type="checkbox" checked={displayMode} onChange={e => setDisplayMode(e.target.checked)} style={{ accentColor: "#4f8ef7" }} />
            Display mode
          </label>
        </div>
      </header>

      {/* ── EXAMPLES BAR ── */}
      {showExamples && (
        <div style={S.exBar}>
          {EXAMPLES.map(ex => (
            <button key={ex.name} style={S.exChip}
              onClick={() => { setLatex(ex.latex); pushHistory(ex.latex); setShowExamples(false); }}>
              {ex.name}
            </button>
          ))}
        </div>
      )}

      {/* ── BODY ── */}
      <div style={S.body}>

        {/* ── LEFT SIDEBAR: group list ── */}
        <nav style={S.sidebar}>
          {TOOLBAR_GROUPS.map(g => (
            <button key={g.id} style={{ ...S.sideBtn, ...(activeGroup === g.id ? S.sideBtnActive : {}) }}
              onClick={() => setActiveGroup(g.id)}>
              <span style={S.sideBtnIcon}>{g.icon}</span>
              <span style={S.sideBtnLabel}>{g.label}</span>
            </button>
          ))}
        </nav>

        {/* ── CENTER ── */}
        <div style={S.center}>

          {/* Quick symbols bar — like Word's top symbols row */}
          <div style={S.quickBar}>
            {QUICK_SYMBOLS.map((s, i) => (
              <button key={i} title={s.tip} style={S.quickBtn} onClick={() => insertAt(s.ins)}>
                {s.tip}
              </button>
            ))}
          </div>

          {/* Symbol palette for active group */}
          <div style={S.paletteBox}>
            <div style={S.paletteHeader}>
              <span style={S.paletteTitle}>{TOOLBAR_GROUPS.find(g => g.id === activeGroup)?.label}</span>
              <span style={S.paletteCount}>{activeItems.length} items</span>
            </div>
            <div style={S.paletteGrid}>
              {activeItems.map((item, idx) => (
                <button key={idx} title={item.tip} style={S.paletteBtn}
                  onClick={() => insertAt(item.ins)}>
                  {katexReady
                    ? <KatexRender latex={item.display} display={false} style={{ pointerEvents: "none" }} />
                    : <span style={{ fontSize: 10, color: "#aaa" }}>{item.tip}</span>
                  }
                  <span style={S.paletteTip}>{item.tip}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Preview */}
          <div style={S.previewBox}>
            <div style={S.boxHeader}>
              <span style={S.boxTitle}>Live Preview</span>
              <div style={S.previewActions}>
                <span style={S.modeTag}>{displayMode ? "Display" : "Inline"}</span>
                <button
                  title="Copy equation as image — then paste into Word, Docs, etc."
                  onClick={downloadImage}
                  style={{
                    background: "#1e3a70", border: "1px solid #2e5098",
                    color: "#7ab8ff", borderRadius: 6, padding: "3px 11px", fontSize: 11,
                    cursor: "pointer", fontFamily: "inherit", transition: "all .2s",
                  }}>
                  {copied === "img" ? "✓ Saving…" : "📷 Save as PNG"}
                </button>
              </div>
            </div>
            <div ref={previewRef} style={{ ...S.previewContent, ...previewStyle }}>
              {katexReady
                ? <KatexRender latex={latex} display={displayMode} />
                : <span style={{ color: "#999", fontSize: 13 }}>Loading KaTeX…</span>
              }
            </div>
          </div>

          {/* Editor */}
          <div style={S.editorBox}>
            <div style={S.boxHeader}>
              <span style={S.boxTitle}>LaTeX Source</span>
              <div style={S.editorToolbar}>
                <button style={S.tbBtn} onClick={undo} disabled={histIdx === 0} title="Undo (Ctrl+Z)">↩ Undo</button>
                <button style={S.tbBtn} onClick={redo} disabled={histIdx >= history.length - 1} title="Redo">↪ Redo</button>
                <button style={{ ...S.tbBtn, color: "#ff6b6b" }} onClick={() => { setLatex(""); pushHistory(""); }} title="Clear">✕ Clear</button>
              </div>
            </div>
            <textarea
              ref={textareaRef}
              style={S.textarea}
              value={latex}
              onChange={handleChange}
              spellCheck={false}
              placeholder="Type or paste LaTeX here…"
              onKeyDown={e => {
                if (e.ctrlKey && e.key === "z") { e.preventDefault(); undo(); }
                if (e.ctrlKey && e.key === "y") { e.preventDefault(); redo(); }
              }}
            />
          </div>

          {/* Output row */}
          <div style={S.outputRow}>
            {[
              { key: "raw", label: "Raw LaTeX", value: latex },
              { key: "inline", label: "Inline $…$", value: `$${latex}$` },
              { key: "display", label: "Display $$…$$", value: `$$${latex}$$` },
            ].map(o => (
              <div key={o.key} style={S.outputCard}>
                <div style={S.outputLabel}>{o.label}</div>
                <code style={S.outputCode}>{o.value || "—"}</code>
                <button style={{ ...S.copyBtn, ...(copied === o.key ? S.copyBtnDone : {}) }}
                  onClick={() => copy(o.value, o.key)}>
                  {copied === o.key ? "✓ Copied!" : "Copy"}
                </button>
              </div>
            ))}
          </div>

          {/* Integration tips */}
          <details style={S.details}>
            <summary style={S.detailsSummary}>📎 How to use in MS Word / Google Docs / Web</summary>
            <div style={S.detailsBody}>
              <div style={S.tipRow}><strong>MS Word / PowerPoint / Docs</strong> Click <em>copied === "img" ? "✓ Saving…" : "📷 Save as PNG"</em> in the Live Preview header → Ctrl+V in Word. The equation pastes as a crisp image.</div>
              <div style={S.tipRow}><strong>Google Docs</strong> Insert → Equation, or install <em>Auto-LaTeX Equations</em> add-on from Marketplace</div>
              <div style={S.tipRow}><strong>Web / HTML</strong> Load KaTeX or MathJax CDN, use <code>{"$$...$$"}</code> delimiters</div>
              <div style={S.tipRow}><strong>Jupyter Notebook</strong> Cell type Markdown, use <code>{"$...$"}</code> inline or <code>{"$$...$$"}</code> block</div>
              <div style={S.tipRow}><strong>LaTeX Document</strong> Paste directly into math environment: <code>{"\\[ ... \\]"}</code> or <code>{"$ ... $"}</code></div>
            </div>
          </details>
        </div>
      </div>

      {/* ── MATRIX BUILDER MODAL ── */}
      {showMatrix && (
        <MatrixBuilder onInsert={insertAt} onClose={() => setShowMatrix(false)} />
      )}
    </div>
  );
}
