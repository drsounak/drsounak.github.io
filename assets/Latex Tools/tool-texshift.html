<script type="text/babel">
const { useState, useCallback, useRef, useEffect, useMemo, useReducer } = React;


/* ============================================================
   TeXShift — journal-to-journal LaTeX reformatter (React)
   ============================================================ */

const C = { JOU:"Journal", CONF:"Conference", GEN:"General" };
const TARGETS = [
  { id:"article", cat:C.GEN, label:"Generic Article", cls:"article" },
  { id:"amsart", cat:C.GEN, label:"AMS Article", cls:"amsart" },
  { id:"ieeej", cat:C.JOU, label:"IEEE Transactions / Journal", cls:"IEEEtran" },
  { id:"acmj", cat:C.JOU, label:"ACM Journal (acmsmall)", cls:"acmart" },
  { id:"elsevier", cat:C.JOU, label:"Elsevier (elsarticle)", cls:"elsarticle" },
  { id:"snjnl", cat:C.JOU, label:"Springer Nature (sn-jnl)", cls:"sn-jnl" },
  { id:"revtex", cat:C.JOU, label:"REVTeX (APS, PRL)", cls:"revtex4-2" },
  { id:"siam", cat:C.JOU, label:"SIAM Article", cls:"siamart" },
  { id:"ieeec", cat:C.CONF, label:"IEEE Conference", cls:"IEEEtran" },
  { id:"acmc", cat:C.CONF, label:"ACM Conference (sigconf)", cls:"acmart" },
  { id:"llncs", cat:C.CONF, label:"Springer LNCS", cls:"llncs" },
  { id:"lipics", cat:C.CONF, label:"Dagstuhl LIPIcs", cls:"lipics-v2021" },
  { id:"neurips", cat:C.CONF, label:"NeurIPS", cls:"neurips_2024" },
  { id:"iclr", cat:C.CONF, label:"ICLR", cls:"iclr2024_conference" },
  { id:"icml", cat:C.CONF, label:"ICML", cls:"icml2024" },
  { id:"aaai", cat:C.CONF, label:"AAAI", cls:"aaai24" },
  { id:"ijcai", cat:C.CONF, label:"IJCAI", cls:"ijcai24" },
  { id:"acl", cat:C.CONF, label:"ACL / EMNLP / NAACL", cls:"acl" },
  { id:"cvpr", cat:C.CONF, label:"CVPR / ICCV / WACV", cls:"cvpr" },
];
const tById = (id) => TARGETS.find(t=>t.id===id);
const SOURCE_NAMES = { ieee:"IEEEtran", acmart:"acmart (ACM)", elsarticle:"elsarticle (Elsevier)", llncs:"Springer LNCS", lipics:"Dagstuhl LIPIcs", revtex:"REVTeX (APS/AIP)", snjnl:"Springer Nature (sn-jnl)", amsart:"AMS article", neurips:"NeurIPS", iclr:"ICLR", icml:"ICML", aaai:"AAAI", ijcai:"IJCAI", acl:"ACL/EMNLP", cvpr:"CVPR/ICCV", article:"Generic article-class" };

/* ---------------- parsing helpers (pure) ---------------- */
const EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
function balancedAfter(s,from){ const o=s.indexOf("{",from); if(o<0) return null; let d=0,i=o; for(;i<s.length;i++){ if(s[i]==="{")d++; else if(s[i]==="}"){ d--; if(d===0) return {body:s.slice(o+1,i),end:i+1}; } } return {body:s.slice(o+1),end:s.length}; }
function grab(s,name){ const re=new RegExp("\\\\"+name+"(?![A-Za-z])","g"); let m; while((m=re.exec(s))){ let i=m.index+m[0].length; while(s[i]==="["){ const c=s.indexOf("]",i); if(c<0)break; i=c+1; } while(/\s/.test(s[i]))i++; if(s[i]!=="{")continue; const b=balancedAfter(s,i); if(b) return {body:b.body,start:m.index,end:b.end}; } return null; }
function grabAll(s,name){ const out=[]; const re=new RegExp("\\\\"+name+"(?![A-Za-z])","g"); let m; while((m=re.exec(s))){ let i=m.index+m[0].length; while(s[i]==="["){ const c=s.indexOf("]",i); if(c<0)break; i=c+1; } while(/\s/.test(s[i]))i++; if(s[i]!=="{"){continue;} const b=balancedAfter(s,i); if(b){ out.push(b.body); re.lastIndex=b.end; } } return out; }
function grabEnv(s,env){ const re=new RegExp("\\\\begin\\{"+env+"\\}([\\s\\S]*?)\\\\end\\{"+env+"\\}"); const m=s.match(re); return m?m[1].trim():null; }
function removeCmd(s,name){ const re=new RegExp("\\\\"+name+"(?![A-Za-z])"); let m; while((m=re.exec(s))){ const b=balancedAfter(s,m.index); if(!b)break; s=s.slice(0,m.index)+s.slice(b.end); } return s; }
function cleanName(s){ ["thanks","footnote","IEEEmembership","IEEEauthorrefmark","inst","corref","fnref","orcidlink","orcid","altaffilmark","ead"].forEach(c=>s=removeCmd(s,c)); s=s.replace(/\$\^\{[^}]*\}\$/g," ").replace(/\$\^[^$]*\$/g," ").replace(/\\\\/g," ").replace(/~/g," ").replace(/[†‡*]/g,"").replace(/\\and\b/g," ").replace(/\\\w+\b/g,"").replace(/[{}]/g,""); return s.replace(/\s+/g," ").replace(/^[\s,]+|[\s,]+$/g,"").trim(); }
function cleanAff(s){ ["corref","fnref","orcidlink","orcid"].forEach(c=>s=removeCmd(s,c)); s=s.replace(/\\IEEEauthorblockA/g,"").replace(/\$\^\{?[^${}]*\}?\$/g," "); let email=""; const em=s.match(EMAIL); if(em){ email=em[0]; s=s.replace(em[0],""); } s=s.replace(/\\\\/g,", ").replace(/~/g," ").replace(/\\institution|\\orgname|\\orgdiv|\\orgaddress|\\city|\\country|\\postcode|\\street/g,"").replace(/organization=|addressline=|city=|country=|postcode=/g,"").replace(/[{}]/g,"").replace(/\s*,\s*,\s*/g,", ").replace(/\s+/g," ").replace(/^[\s,]+|[\s,]+$/g,"").trim(); return { aff:s, email }; }
function splitAnd(s){ return s.split(/\\and\b/).map(x=>x.trim()).filter(Boolean); }
function grabAllWithOpt(s,name){ const out=[]; const re=new RegExp("\\\\"+name+"(?![A-Za-z])(\\[([^\\]]*)\\])?","g"); let m; while((m=re.exec(s))){ let i=m.index+m[0].length; while(/\s/.test(s[i]))i++; if(s[i]!=="{")continue; const b=balancedAfter(s,i); if(b){ out.push({opt:m[2]||"",body:b.body}); re.lastIndex=b.end; } } return out; }
function grabAllWithOpt2(s,name){ const out=[]; const re=new RegExp("\\\\"+name+"(?![A-Za-z])","g"); let m; while((m=re.exec(s))){ let i=m.index+m[0].length; const parts=[]; for(let g=0;g<5;g++){ while(/\s/.test(s[i]))i++; if(s[i]!=="{")break; const b=balancedAfter(s,i); if(!b)break; parts.push(b.body); i=b.end; } out.push(parts); re.lastIndex=i; } return out; }

function detectSource(src){
  const dc=src.match(/\\documentclass\s*(\[[^\]]*\])?\s*\{([^}]+)\}/);
  const cls=dc?dc[2].trim():""; const pre=src.slice(0,(src.indexOf("\\begin{document}")+1)||src.length);
  let y;
  if(/IEEEtran/i.test(cls)) return {type:"ieee",cls,conf:/conference/i.test((dc&&dc[1])||"")};
  if(/acmart/i.test(cls)) return {type:"acmart",cls};
  if(/elsarticle/i.test(cls)) return {type:"elsarticle",cls};
  if(/llncs/i.test(cls)) return {type:"llncs",cls};
  if(/lipics/i.test(cls)) return {type:"lipics",cls};
  if(/revtex/i.test(cls)) return {type:"revtex",cls};
  if(/sn-jnl/i.test(cls)) return {type:"snjnl",cls};
  if(/amsart/i.test(cls)) return {type:"amsart",cls};
  if((y=pre.match(/neurips_(\d{4})/))) return {type:"neurips",cls,year:y[1]};
  if((y=pre.match(/iclr(\d{4})_conference/))) return {type:"iclr",cls,year:y[1]};
  if((y=pre.match(/\{icml(\d{4})\}/))) return {type:"icml",cls,year:y[1]};
  if((y=pre.match(/\{(aaai\d+)\}/))) return {type:"aaai",cls,sty:y[1]};
  if((y=pre.match(/\{(ijcai\d+)\}/))) return {type:"ijcai",cls,sty:y[1]};
  if(/\\usepackage(\[[^\]]*\])?\{acl\}/.test(pre)) return {type:"acl",cls};
  if((y=pre.match(/\\usepackage\{(cvpr|iccv|wacv)\}/))) return {type:"cvpr",cls,sty:y[1]};
  return {type:"article",cls:cls||"article"};
}

function extractAuthors(src,info,warn){
  const t=info.type; let A=[];
  try{
    if(t==="ieee"){
      const ns=grabAll(src,"IEEEauthorblockN"),as=grabAll(src,"IEEEauthorblockA");
      if(ns.length){ ns.forEach((n,i)=>{ const c=cleanAff(as[i]||""); A.push({name:cleanName(n),aff:c.aff,email:c.email}); }); }
      else { const a=grab(src,"author"); if(a){ splitAnd(a.body).forEach(p=>{ const th=grab(p,"thanks"); const c=cleanAff(th?th.body:""); A.push({name:cleanName(p),aff:c.aff,email:c.email}); }); } }
    } else if(t==="acmart"){
      const re=/\\author(?![A-Za-z])/g; let m; const idxs=[]; while((m=re.exec(src)))idxs.push(m.index);
      idxs.forEach((ix,k)=>{ const nb=balancedAfter(src,ix); if(!nb)return; const seg=src.slice(nb.end,idxs[k+1]!==undefined?idxs[k+1]:src.length);
        const af=grab(seg,"affiliation"); let aff=""; if(af){ const inst=grab(af.body,"institution"); aff=cleanAff(inst?inst.body:af.body).aff; }
        const em=grab(seg,"email"); A.push({name:cleanName(nb.body),aff,email:em?cleanName(em.body):""}); });
    } else if(t==="elsarticle"){
      const re=/\\author(?![A-Za-z])(\[[^\]]*\])?/g; let m; const idxs=[]; while((m=re.exec(src)))idxs.push(m.index);
      const affMap={}; grabAllWithOpt(src,"affiliation").forEach(o=>{ const org=grab(o.body,"organization")||{body:o.body}; affMap[o.opt]=cleanAff(org.body).aff; });
      idxs.forEach((ix,k)=>{ const optM=src.slice(ix).match(/^\\author\[([^\]]*)\]/); const opt=optM?optM[1]:""; const nb=balancedAfter(src,ix); if(!nb)return;
        const seg=src.slice(nb.end,idxs[k+1]!==undefined?idxs[k+1]:src.length); const ead=grab(seg,"ead");
        A.push({name:cleanName(nb.body),aff:affMap[opt]||"",email:ead?cleanName(ead.body):""}); });
    } else if(t==="llncs"){
      const au=grab(src,"author"),inst=grab(src,"institute");
      const names=au?splitAnd(au.body):[]; const affs=inst?splitAnd(inst.body):[];
      names.forEach((n,i)=>{ const c=cleanAff(affs[i]||affs[0]||""); A.push({name:cleanName(n),aff:c.aff,email:c.email}); });
    } else if(t==="lipics"){
      grabAllWithOpt2(src,"author").forEach(a=>{ A.push({name:cleanName(a[0]||""),aff:cleanAff(a[1]||"").aff,email:cleanName(a[2]||"")}); });
    } else if(t==="revtex"||t==="amsart"){
      const re=/\\author(?![A-Za-z])/g; let m; const idxs=[]; while((m=re.exec(src)))idxs.push(m.index);
      idxs.forEach((ix,k)=>{ const nb=balancedAfter(src,ix); if(!nb)return; const seg=src.slice(nb.end,idxs[k+1]!==undefined?idxs[k+1]:src.length);
        const af=grab(seg,t==="amsart"?"address":"affiliation"); const em=grab(seg,"email");
        A.push({name:cleanName(nb.body),aff:af?cleanAff(af.body).aff:"",email:em?cleanName(em.body):""}); });
    } else if(t==="snjnl"){
      const re=/\\author(?![A-Za-z])(\[[^\]]*\])?/g; let m; const idxs=[]; while((m=re.exec(src)))idxs.push(m.index);
      idxs.forEach((ix,k)=>{ const nb=balancedAfter(src,ix); if(!nb)return; const seg=src.slice(nb.end,idxs[k+1]!==undefined?idxs[k+1]:src.length);
        const fn=grab(nb.body,"fnm"),sr=grab(nb.body,"sur"); const nm=(fn||sr)?[fn&&fn.body,sr&&sr.body].filter(Boolean).join(" "):nb.body;
        const af=grab(seg,"affil"); let aff=""; if(af){ const org=grab(af.body,"orgname"); aff=cleanAff(org?org.body:af.body).aff; }
        const em=grab(seg,"email"); A.push({name:cleanName(nm),aff,email:em?cleanName(em.body):""}); });
    } else if(t==="icml"){
      const affMap={}; grabAllWithOpt2(src,"icmlaffiliation").forEach(a=>{ affMap[(a[0]||"").trim()]=cleanAff(a[1]||"").aff; });
      const corr={}; grabAllWithOpt2(src,"icmlcorrespondingauthor").forEach(a=>{ corr[cleanName(a[0]||"")]=cleanName(a[1]||""); });
      grabAllWithOpt2(src,"icmlauthor").forEach(a=>{ const nm=cleanName(a[0]||""); A.push({name:nm,aff:affMap[(a[1]||"").split(",")[0].trim()]||"",email:corr[nm]||""}); });
    } else if(t==="ijcai"){
      const au=grab(src,"author"); if(au){ let b=au.body; const af=b.indexOf("\\affiliations"); const em=b.indexOf("\\emails");
        const namePart=b.slice(0,af>=0?af:b.length); const affPart=af>=0?b.slice(af+13,em>=0?em:b.length):""; const emPart=em>=0?b.slice(em+7):"";
        const names=namePart.split(/\\and\b/).map(cleanName).filter(Boolean);
        const affs=affPart.split(/\\\\/).map(x=>cleanAff(x).aff).filter(Boolean);
        const emails=emPart.split(/[,\n]/).map(x=>{ const e=x.match(EMAIL); return e?e[0]:""; }).filter(Boolean);
        names.forEach((n,i)=>A.push({name:n,aff:affs[i]||affs[0]||"",email:emails[i]||""})); }
    } else if(t==="neurips"||t==="iclr"||t==="acl"){
      const au=grab(src,"author"); if(au){ au.body.split(/\\And\b|\\AND\b/).forEach(chunk=>{ const lines=chunk.split(/\\\\/).map(x=>x.trim()).filter(Boolean);
        if(!lines.length)return; const name=cleanName(lines[0]); let aff="",email="";
        lines.slice(1).forEach(l=>{ const e=l.match(EMAIL); if(e){ email=e[0]; } else { aff=(aff?aff+", ":"")+cleanAff(l).aff; } });
        if(name)A.push({name,aff,email}); }); }
    } else {
      const au=grab(src,"author");
      if(au&&(t==="cvpr"||t==="aaai")){ const lines=au.body.split(/\\\\/).map(x=>x.trim()).filter(Boolean);
        const names=(lines[0]||"").split(/,|\\and\b|\\quad/).map(cleanName).filter(Boolean);
        let aff="",emails=[]; lines.slice(1).forEach(l=>{ if(EMAIL.test(l)) l.split(/[, ]+/).forEach(tok=>{ const e=tok.match(EMAIL); if(e)emails.push(e[0]); }); else aff=(aff?aff+", ":"")+cleanAff(l).aff; });
        names.forEach((n,i)=>A.push({name:n,aff,email:emails[i]||""})); }
      else if(au){ splitAnd(au.body).forEach(p=>{ const th=grab(p,"thanks")||grab(p,"footnote"); const c=cleanAff(th?th.body:""); A.push({name:cleanName(p),aff:c.aff,email:c.email}); }); }
    }
  }catch(e){ warn.push(["warn","Author block was hard to parse automatically — please double-check names and affiliations."]); }
  A=A.filter(a=>a.name);
  if(!A.length){ warn.push(["warn","Couldn't extract authors automatically. Add them by hand in the converted file."]); A=[{name:"Author Name",aff:"Affiliation",email:""}]; }
  return A;
}

function extractExtraPreamble(pre,warn){
  const lines=pre.split(/\r?\n/); const keep=[]; const seen=new Set();
  const skipPkg=/^(inputenc|fontenc|graphicx|hyperref|amsmath|amssymb|amsfonts|cite|babel|times|helvet|courier|microtype|url|latexsym|geometry|natbib)$/i;
  lines.forEach(l=>{ const tr=l.trim();
    if(/^%/.test(tr))return;
    if(/^\\usepackage/.test(tr)){ const m=tr.match(/\\usepackage(\[[^\]]*\])?\{([^}]*)\}/); if(!m)return; const names=m[2].split(",").map(x=>x.trim());
      if(names.every(n=>skipPkg.test(n)))return; if(seen.has(tr))return; seen.add(tr); keep.push(tr); return; }
    if(/^\\(newcommand|renewcommand|providecommand|def|DeclareMathOperator|newtheorem|theoremstyle|DeclarePairedDelimiter|graphicspath|newcolumntype|setlength|newenvironment)\b/.test(tr)){ if(seen.has(tr))return; seen.add(tr); keep.push(tr); }
  });
  if(keep.length) warn.push(["info",keep.length+" custom package/macro line"+(keep.length>1?"s":"")+" carried over — review for conflicts with the new class."]);
  return keep.join("\n");
}

function parse(src){
  const warn=[]; const info=detectSource(src);
  warn.push(["ok","Detected source format: <code>"+(SOURCE_NAMES[info.type]||info.cls)+"</code>"+(info.year?" ("+info.year+")":"")]);
  const docStart=src.indexOf("\\begin{document}");
  const preamble=docStart>=0?src.slice(0,docStart):src;
  const titleG=grab(src,"title"); let title=titleG?titleG.body.trim():"";
  let subtitle=""; const subG=grab(src,"subtitle"); if(subG)subtitle=subG.body.trim();
  if(!subtitle&&/\\\\/.test(title)){ const parts=title.split(/\\\\/); title=parts[0].trim(); const rest=parts.slice(1).join(" ").replace(/\\(large|Large|small|it|bf|textit|textbf)\b/g,"").replace(/[{}]/g,"").trim(); if(rest)subtitle=rest; }
  let abstract=grabEnv(src,"abstract"); if(!abstract){ const a=grab(src,"abstract"); if(a)abstract=a.body.trim(); }
  let kw=[]; const kwEnv=grabEnv(src,"IEEEkeywords")||grabEnv(src,"keyword")||grabEnv(src,"keywords");
  const kwCmd=grab(src,"keywords")||grab(src,"icmlkeywords");
  let kwRaw=kwEnv||(kwCmd?kwCmd.body:"");
  if(kwRaw){ if(abstract)kwRaw=kwRaw.replace(abstract,""); kw=kwRaw.split(/\\sep|\\and\b|,/).map(x=>x.replace(/\\keywords\{?/,"").replace(/[{}]/g,"").trim()).filter(Boolean); }
  if(abstract&&kwEnv){ abstract=abstract.replace(/\\keywords\{[^}]*\}/,"").trim(); }
  const authors=extractAuthors(src,info,warn);
  const bodyStartMarkers=[/\\maketitle/g,/\\end\{abstract\}/g,/\\end\{frontmatter\}/g,/\\printAffiliationsAndNotice\s*\{[^}]*\}/g,/\\maketitleabstract/g];
  let bStart=-1; bodyStartMarkers.forEach(re=>{ let m,last=-1; while((m=re.exec(src)))last=m.index+m[0].length; if(last>bStart)bStart=last; });
  if(bStart<0){ const sec=src.search(/\\section\b/); bStart=sec>=0?sec:(docStart>=0?docStart+16:0); }
  const ends=[src.indexOf("\\begin{thebibliography}"),src.search(/\\bibliography\{/),src.indexOf("\\end{document}")].filter(i=>i>=0);
  let bEnd=ends.length?Math.min(...ends):src.length; if(bEnd<bStart)bEnd=src.length;
  let body=src.slice(bStart,bEnd).trim();
  if(!body){ warn.push(["warn","Body text looked empty after parsing — check the source has \\maketitle and \\section commands."]); }
  let bib="",hasExtBib=false,bibFile="";
  const thb=grabEnv(src,"thebibliography");
  if(thb!==null){ const full=src.match(/\\begin\{thebibliography\}[\s\S]*?\\end\{thebibliography\}/); bib=full?full[0]:""; warn.push(["ok","Preserved inline <code>thebibliography</code> ("+(grabAll(bib,"bibitem").length)+" entries)."]); }
  else { const bm=src.match(/\\bibliography\{([^}]*)\}/); if(bm){ hasExtBib=true; bibFile=bm[1]; warn.push(["info","Uses an external <code>"+bibFile+".bib</code> — the file carries over; bibliography style set to the target's default."]); } }
  const extra=extractExtraPreamble(preamble,warn);
  warn.push([abstract?"ok":"warn",abstract?"Abstract mapped.":"No abstract found."]);
  warn.push([kw.length?"ok":"info",kw.length?("Keywords mapped ("+kw.length+")."):"No keywords found."]);
  warn.push(["ok",authors.length+" author"+(authors.length>1?"s":"")+" mapped."]);
  return { info,title,subtitle,abstract:abstract||"",keywords:kw,authors,body,bib,hasExtBib,bibFile,extra,warn };
}

/* ---------------- emitters (pure) ---------------- */
function pkgs(){ return "\\usepackage[utf8]{inputenc}\n\\usepackage[T1]{fontenc}\n\\usepackage{amsmath,amssymb}\n\\usepackage{graphicx}\n\\usepackage{hyperref}"; }
function extraBlock(ir){ return ir.extra?"\n% ---- carried over from your source (check for conflicts) ----\n"+ir.extra+"\n":""; }
function bibBlock(ir,style){ if(ir.bib) return "\n"+ir.bib+"\n"; if(ir.hasExtBib) return "\n\\bibliographystyle{"+style+"}\n\\bibliography{"+ir.bibFile+"}\n"; return ""; }
function absB(ir){ return ir.abstract?"\\begin{abstract}\n"+ir.abstract+"\n\\end{abstract}\n":""; }
const bodyB = (ir) => "\n"+ir.body+"\n";
const E = {};
E.article = (ir) => { const au=ir.authors.map(a=>{ const f=[a.aff,a.email].filter(Boolean).join("\\\\ "); return a.name+(f?"\\thanks{"+f+"}":""); }).join(" \\and ");
  let s="\\documentclass[11pt,a4paper]{article}\n"+pkgs()+"\n\\usepackage[margin=1in]{geometry}"+extraBlock(ir)+"\n\n\\title{"+(ir.title||"Untitled")+(ir.subtitle?"\\\\[2pt]\\large "+ir.subtitle:"")+"}\n\\author{"+au+"}\n\\date{\\today}\n\n\\begin{document}\n\\maketitle\n"+absB(ir);
  if(ir.keywords.length) s+="\n\\noindent\\textbf{Keywords:} "+ir.keywords.join(", ")+"\n";
  return s+bodyB(ir)+bibBlock(ir,"plain")+"\n\\end{document}\n"; };

/* ---------------- syntax highlight ---------------- */
function highlight(src){
  let h=src.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  h=h.replace(/(^|\n)(%[^\n]*)/g,(m,a,b)=>a+'<span class="cmt">'+b+'</span>');
  h=h.replace(/(\\[a-zA-Z@]+\*?)/g,'<span class="cmd">$1</span>');
  h=h.replace(/(\\begin|\\end)<\/span>(\{)([^}]*)(\})/g,'$1</span>$2<span class="env">$3</span>$4');
  h=h.replace(/(\[)([^\]\n]*)(\])/g,'$1<span class="opt">$2</span>$3');
  return h;
}

    if(target==="acmj"||target==="acmc") adv.push("ACM wants CCS concepts (<code>\\ccsdesc</code>) and copyright info — add before submission.");
    if(target==="lipics") adv.push("LIPIcs requires <code>\\ccsdesc</code>, <code>\\Copyright</code> and category metadata — placeholders inserted.");
    if(target==="cvpr") adv.push("Set <code>\\cvprPaperID</code> and toggle <code>\\cvprfinaltrue</code> for camera-ready.");
    if((target==="ieeec"||target==="ieeej")&&ir.bib) adv.push("IEEE prefers BibTeX; an inline bibliography was kept as-is.");
    if(/\\cite\{/.test(ir.body)&&!ir.bib&&!ir.hasExtBib) adv.push("Body has <code>\\cite</code> commands but no bibliography was found — add your references.");
    return adv;
  }, [parsed, target]);

  const pickCat = (c) => { setCat(c); const first=TARGETS.find(t=>t.cat===c); setTarget(first.id); };
  const onFile = (e) => { const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>setSrc(String(r.result||"")); r.readAsText(f); };

  const copy = async () => { if(!result)return; try{ await navigator.clipboard.writeText(result); }catch{ const ta=document.createElement("textarea"); ta.value=result; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); } setToast("Copied ✓"); };
  const download = () => { if(!result)return; const b=new Blob([result],{type:"text/x-tex"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=target+"-converted.tex"; a.click(); URL.revokeObjectURL(a.href); setToast("Downloaded"); };
  const overleaf = () => { if(!result)return; const f=document.createElement("form"); f.action="https://www.overleaf.com/docs"; f.method="post"; f.target="_blank"; f.style.display="none"; const i=document.createElement("input"); i.type="hidden"; i.name="snip"; i.value=result; const e=document.createElement("input"); e.type="hidden"; e.name="engine"; e.value="pdflatex"; f.appendChild(i); f.appendChild(e); document.body.appendChild(f); f.submit(); f.remove(); setToast("Opening in Overleaf…"); };

  const detName = parsed && !parsed.error ? (SOURCE_NAMES[parsed.ir.info.type]||parsed.ir.info.cls)+(parsed.ir.info.year?" "+parsed.ir.info.year:"") : "—";
  const t = tById(target);

  let reportItems;
  if(!src.trim()) reportItems = [["info","Paste a source and choose a target to see what was mapped."]];
  else if(parsed && parsed.error) reportItems = [["warn","Parsing failed: "+parsed.error+". Check the source is a complete .tex file."]];
  else reportItems = [...parsed.ir.warn, ...advisories.map(m=>["warn",m]), ["ok","Converted to <code>"+t.label+"</code>."]];

  return (
    <div className="tx">
      <style>{CSS}</style>
      <header className="top">
        <div className="brand">
          <h1>Te<span className="x">X</span>Shift</h1>
          <p>Rejected and resubmitting elsewhere? Paste your paper's LaTeX, pick the new venue, and get it reformatted — document class, author block, abstract, keywords and bibliography rewritten, your body and macros preserved.</p>
        </div>
        <div className="ribbon">reformat · resubmit · repeat</div>
      </header>

      <div className="wrap">
        <div className="flow">
          <section className="panel">
            <h2>Source LaTeX <span className="tag">paste or upload</span></h2>
            <div className="pbody">
              <textarea value={src} onChange={e=>setSrc(e.target.value)} placeholder="Paste your full .tex source here (from \documentclass to \end{document})…"/>
              <div className="btnrow">
                <button className="btn ghost" onClick={()=>fileRef.current && fileRef.current.click()}>↑ Upload .tex</button>
                <input ref={fileRef} type="file" accept=".tex,.txt" style={{display:"none"}} onChange={onFile}/>
                <button className="btn ghost" onClick={()=>setSrc(SAMPLE)}>Load example</button>
                <button className="btn ghost" onClick={()=>setSrc("")}>Clear</button>
              </div>
              <div className="detected">Detected source: <b>{detName}</b></div>
            </div>
          </section>

          <div className="arrowcol"><div className="arrow">➜</div></div>

          <section className="panel">
            <h2>Target format <span className="tag">choose venue</span></h2>
            <div className="pbody">
              <div className="cats">
                {[C.JOU,C.CONF,C.GEN].map(c=>(<button key={c} className={"cat"+(c===cat?" on":"")} onClick={()=>pickCat(c)}>{c}</button>))}
              </div>
              <label>Template</label>
              <select value={target} onChange={e=>setTarget(e.target.value)}>
                {TARGETS.filter(x=>x.cat===cat).map(x=>(<option key={x.id} value={x.id}>{x.label}</option>))}
              </select>
              <div className="detected" style={{marginTop:12}}>Outputs <b>{"\\documentclass{"+t.cls+"}"}</b></div>
            </div>
          </section>
        </div>

        <section className="panel">
          <h2>Converted LaTeX
            <span style={{display:"flex",gap:8}}>
              <button className="btn ghost" onClick={copy}>⧉ Copy</button>
              <button className="btn ghost" onClick={download}>↓ .tex</button>
              <button className="btn" onClick={overleaf}>↗ Overleaf</button>
            </span>
          </h2>
          <div className="pbody">
            <pre className="code"><code dangerouslySetInnerHTML={{__html: result ? highlight(result) : "Your converted source will appear here."}}/></pre>
          </div>
        </section>

        <section className="panel report">
          <h2>Conversion report</h2>
          <div className="pbody">
            <ul>
              {reportItems.map(([k,m],i)=>(<li key={i} className={k} dangerouslySetInnerHTML={{__html:m}}/>))}
            </ul>
          </div>
        </section>
      </div>

      <footer>Parsing is heuristic and tuned for well-structured single-file submissions. Always skim the report and recompile before submitting.</footer>
      <div className={"toast"+(toast?" show":"")}>{toast}</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  React.createElement(TeXShift)
);
</script>
</body>
</html>
